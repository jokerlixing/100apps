<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔤 单词卡片 · Word Cards</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6; --purple:#c586c0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-anchor:none}
body{background:radial-gradient(ellipse at 50% 0%,#1e2230 0%,var(--bg) 60%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:640px;margin:0 auto}
header{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}

/* 进度条 */
.prog-bar{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:8px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:9px;transition:width .4s}
.prog-txt{font-size:10px;color:var(--dim);text-align:right;margin-bottom:14px}

/* 卡片 */
.card-zone{perspective:1000px;margin-bottom:18px;min-height:260px}
.fcard{position:relative;width:100%;height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;border:1px solid var(--line)}
.face.front{background:linear-gradient(145deg,var(--panel2),var(--panel))}
.face.back{background:linear-gradient(145deg,#2d3345,#232838);transform:rotateY(180deg)}
.face .word{font-size:44px;font-weight:800;color:var(--gold);letter-spacing:1px;text-align:center;word-break:break-word}
.face .phon{font-size:15px;color:var(--muted);font-family:Consolas,monospace}
.face .hint{font-size:11px;color:var(--dim);position:absolute;bottom:16px}
.face.back .cn{font-size:30px;font-weight:700;text-align:center;line-height:1.5}
.face.back .ex{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7;background:rgba(0,0,0,.2);border-radius:10px;padding:10px 16px;max-width:100%}
.face .tag{position:absolute;top:14px;left:16px;font-size:10px;color:var(--dim);letter-spacing:1px}
.face .lv{position:absolute;top:14px;right:16px;font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(78,201,176,.15);color:var(--green)}
/* 发音按钮 */
.say-btn{position:absolute;bottom:14px;right:14px;background:rgba(229,181,103,.14);border:1px solid var(--gold);color:var(--gold);font-size:13px;padding:7px 14px;border-radius:18px;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.say-btn:hover{background:var(--gold);color:#1a1a22}}
.say-btn:active{transform:scale(.93)}
.say-btn.playing{background:var(--gold);color:#1a1a22;animation:pulse .8s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,181,103,.5)}50%{box-shadow:0 0 0 8px rgba(229,181,103,0)}}

/* 操作按钮 */
.ops{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.op-btn{border:none;font-size:14px;font-weight:700;padding:12px 26px;border-radius:12px;cursor:pointer;outline:none}
.op-btn:active{transform:scale(.96)}
.op-forgot{background:rgba(224,108,117,.15);color:var(--red);border:1px solid var(--red)}
.op-know{background:var(--green);color:#12211d}
.op-skip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-weight:400;font-size:13px;padding:12px 18px}

/* 统计与队列 */
.stats{display:flex;gap:10px;margin-bottom:14px}
.st{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.st .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.st .k{font-size:9px;color:var(--dim);letter-spacing:1px;margin-top:2px}
.st.g .v{color:var(--green)}
.st.r .v{color:var(--red)}
.st.b .v{color:var(--blue)}
.st.p .v{color:var(--purple)}

/* 词库选择 */
.dict-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.db{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:8px 16px;border-radius:18px;cursor:pointer;outline:none}
@media(hover:hover){.db:hover{color:var(--gold);border-color:var(--gold)}}
.db.on{color:var(--gold);border-color:var(--gold);background:rgba(229,181,103,.1)}

.done-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px;text-align:center}
.done-box .big{font-size:44px;margin-bottom:10px}
.done-box h2{color:var(--gold);margin-bottom:8px}
.done-box p{color:var(--muted);font-size:13px;line-height:1.8}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>单词卡片</h1>
      <div class="sub">翻卡记忆 · 艾宾浩斯复习 · 四级高频词</div>
    </div>
  </header>

  <div class="dict-row" id="dictRow"></div>

  <div class="stats">
    <div class="st b"><div class="v" id="sQueue">0</div><div class="k">待复习</div></div>
    <div class="st g"><div class="v" id="sKnow">0</div><div class="k">已掌握</div></div>
    <div class="st r"><div class="v" id="sForgot">0</div><div class="k">需巩固</div></div>
    <div class="st p"><div class="v" id="sLv">—</div><div class="k">当前熟练度</div></div>
  </div>

  <div id="stage">
    <div class="prog-bar"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
    <div class="prog-txt" id="pTxt">0 / 0</div>
    <div class="card-zone">
      <div class="fcard" id="fcard" onclick="flip()">
        <div class="face front">
          <span class="tag" id="fTag">CARD</span>
          <span class="lv" id="fLv">Lv.0</span>
          <button class="say-btn" id="sayBtn" onclick="event.stopPropagation();speak()" title="播放发音">🔊</button>
          <div class="word" id="wWord">—</div>
          <div class="phon" id="wPhon"></div>
          <div class="hint">点击卡片查看释义</div>
        </div>
        <div class="face back">
          <div class="cn" id="wCn">—</div>
          <div class="ex" id="wEx"></div>
          <button class="say-btn" style="bottom:44px" onclick="event.stopPropagation();speak()" title="播放发音">🔊 再听一遍</button>
          <div class="hint">记住了吗？</div>
        </div>
      </div>
    </div>
    <div class="ops">
      <button class="op-btn op-forgot" onclick="mark(false)">😵 没记住</button>
      <button class="op-btn op-skip" onclick="nextCard()">跳过 »</button>
      <button class="op-btn op-know" onclick="mark(true)">😀 记住了</button>
    </div>
  </div>

  <footer>100 Apps Challenge · App #029 · <b>艾宾浩斯间隔重复</b>：记错 lv-1 立即重排，记对 lv+1 延后 2^lv 张<br>🔊 原声播放 Web Speech API · <a href="javascript:void(0)" onclick="autoSay=!autoSay;toast(autoSay?'已开启自动朗读':'已静音');if(autoSay)speak()" style="color:var(--gold)">自动朗读：开/关</a> · lv≥4 掌握 · 数据存 localStorage</footer>
</div>

<script>
/* ============================================================
   新知识点：艾宾浩斯间隔重复（SM-2 简化版）
   - 每词熟练度 lv 0-5：
     记住 → lv+1，卡片插回队列 2^lv 张之后
       （lv0→2张后 lv1→4张后 lv2→8张后 …越熟越晚再见）
     忘了 → lv 归 0，插回仅 2 张后（立刻短间隔重见）
   - lv≥4 = 掌握，移出队列
   - 本会话内重排（卡片插队）即可模拟间隔重复；
     跨天记忆由 localStorage 保存进度延续
   ============================================================ */
const $=id=>document.getElementById(id);
const KEY="wordcards_v1";

/* 词库：CET4 高频 60 词 */
const DICTS={
  "CET4 核心":[
    ["abandon","v. 放弃、抛弃","He abandoned his car in the snow."],
    ["ability","n. 能力、才能","She has the ability to solve problems."],
    ["absorb","v. 吸收、吸引","Plants absorb water through roots."],
    ["abstract","adj. 抽象的 n. 摘要","The idea is too abstract for kids."],
    ["academic","adj. 学术的","His academic performance is great."],
    ["accelerate","v. 加速","The car accelerated down the road."],
    ["access","n. 通道、使用权","You need a password to access files."],
    ["accompany","v. 陪伴、伴随","She accompanied me to the hospital."],
    ["accomplish","v. 完成、实现","We accomplished the task on time."],
    ["account","n. 账户、描述","Open a bank account for salary."],
    ["accurate","adj. 准确的","The map is accurate and detailed."],
    ["achieve","v. 达到、实现","You can achieve your dreams."],
    ["acknowledge","v. 承认、致谢","He acknowledged his mistake."],
    ["acquire","v. 获得、习得","Children acquire language quickly."],
    ["adapt","v. 适应、改编","Animals adapt to the environment."],
    ["adequate","adj. 足够的","We have adequate food for the trip."],
    ["adjust","v. 调整","Please adjust your seat before driving."],
    ["admire","v. 钦佩、欣赏","I admire her courage deeply."],
    ["adopt","v. 采用、收养","They adopted a child from abroad."],
    ["advance","n./v. 前进、进步","Technology advances rapidly."],
    ["advantage","n. 优势","Speaking English is a big advantage."],
    ["afford","v. 负担得起","We can't afford a new house now."],
    ["aggressive","adj. 好斗的、进取的","Be aggressive in pursuing goals."],
    ["anticipate","v. 预期、期望","We anticipate a good harvest."],
    ["anxiety","n. 焦虑","Exams often cause anxiety."],
    ["apologize","v. 道歉","He apologized for being late."],
    ["apparent","adj. 明显的","It was apparent she was tired."],
    ["appeal","n./v. 呼吁、吸引力","The design has wide appeal."],
    ["appliance","n. 家用电器","Kitchen appliances save time."],
    ["approach","n./v. 方法、接近","We need a new approach."],
    ["appropriate","adj. 恰当的","Wear appropriate clothes for work."],
    ["approve","v. 批准、赞成","The boss approved my plan."],
    ["arbitrary","adj. 任意的、武断的","The rule seems arbitrary."],
    ["assist","v. 协助","The nurse assisted the doctor."],
    ["assume","v. 假定、承担","Let's assume the report is true."],
    ["atmosphere","n. 大气、气氛","The restaurant has a cozy atmosphere."],
    ["attach","v. 附上、系上","Attach your photo to the form."],
    ["attempt","n./v. 尝试","He attempted the exam twice."],
    ["attend","v. 出席、照料","All students attended the lecture."],
    ["attitude","n. 态度","A positive attitude helps a lot."],
    ["attract","v. 吸引","Flowers attract bees."],
    ["average","n./adj. 平均、普通","The average score was 75."],
    ["avoid","v. 避免","Avoid eating too much sugar."],
    ["balance","n./v. 平衡","Keep a balance between work and rest."],
    ["barrier","n. 障碍、屏障","Language is a barrier to communication."],
    ["behavior","n. 行为","His behavior surprised everyone."],
    ["benefit","n./v. 利益、受益","Exercise benefits your health."],
    ["budget","n. 预算","We have a tight budget this month."],
    ["campaign","n. 运动、活动","The ad campaign was successful."],
    ["candidate","n. 候选人","She is a strong candidate."],
    ["capacity","n. 容量、能力","The hall has a capacity of 500."],
    ["challenge","n./v. 挑战","Learning is a lifelong challenge."],
    ["circumstance","n. 环境、情况","Under no circumstance give up."],
    ["communicate","v. 交流","We communicate via email."],
    ["compare","v. 比较","Compare the two prices first."],
    ["compete","v. 竞争","They compete for the prize."],
    ["concentrate","v. 集中、专注","Concentrate on your homework."],
    ["confidence","n. 信心","She answered with confidence."],
    ["confuse","v. 使困惑","The signs confused the drivers."],
    ["connect","v. 连接","Connect the printer to the laptop."],
  ],
};

let curDict="CET4 核心";
let queue=[];      /* 待复习 [{word,lv}] */
let stats={know:0,forgot:0};
let idx=0;
let flipped=false;

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.dict===curDict){
      queue=s.queue;stats=s.stats;
    }
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({dict:curDict,queue,stats}))}catch(e){}
}
function initQueue(){
  queue=DICTS[curDict].map((w,i)=>({word:i,lv:0}));
  stats={know:0,forgot:0};
  idx=0;
  save();
}

/* ---------- 渲染 ---------- */
function renderDicts(){
  $("dictRow").innerHTML=Object.keys(DICTS).map(d=>
    `<button class="db ${d===curDict?"on":""}" onclick="switchDict('${d}')">${d} ${DICTS[d].length}词</button>`
  ).join("");
}
function switchDict(d){
  curDict=d;load();
  if(!queue.length)initQueue();
  idx=0;renderCard();
}
function renderCard(){
  /* 队列完成检查 */
  if(idx>=queue.length){showDone();return}
  const item=queue[idx];
  const w=DICTS[curDict][item.word];
  flipped=false;
  $("fcard").classList.remove("flipped");
  $("fTag").textContent=`CARD ${idx+1}/${queue.length}`;
  $("fLv").textContent="Lv."+item.lv;
  $("wWord").textContent=w[0];
  $("wPhon").textContent="";
  $("wCn").textContent=w[1];
  $("wEx").textContent=w[2]?`"${w[2]}"`:"";
  /* 换卡自动朗读原声（可静音） */
  if(autoSay)setTimeout(()=>speak(w[0]),260);
  /* 进度条 */
  const done=stats.know+stats.forgot;
  const total=done+queue.length-idx;
  $("pFill").style.width=(total?done/total*100:0)+"%";
  $("pTxt").textContent=`${done} / ${total}（掌握 ${stats.know}）`;
  /* 统计 */
  $("sQueue").textContent=queue.length-idx;
  $("sKnow").textContent=stats.know;
  $("sForgot").textContent=stats.forgot;
  $("sLv").textContent="Lv."+item.lv;
}
function showDone(){
  $("stage").innerHTML=`<div class="done-box">
    <div class="big">🎉</div>
    <h2>本轮复习完成！</h2>
    <p>掌握 ${stats.know} 词 · 需巩固 ${stats.forgot} 次<br>
    「没记住」的词已重排到队列后面，继续第二轮加深记忆</p>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
      <button class="op-btn op-know" onclick="restart()">↻ 再来一轮</button>
      <button class="op-btn op-skip" onclick="resetAll()">重置进度</button>
    </div>
  </div>`;
}
function restart(){
  /* 重排：lv 高的排后面（掌握的少见面），lv 低的先来 */
  queue.sort((a,b)=>a.lv-b.lv);
  idx=0;
  $("stage").innerHTML=stageHTML;
  renderCard();
}
function resetAll(){
  initQueue();
  $("stage").innerHTML=stageHTML;
  renderCard();
}
/* stage 原始 HTML（showDone 后恢复用） */
const stageHTML=$("stage").innerHTML;

/* ---------- 交互 ---------- */
/* TTS 原声播放：Web Speech API（浏览器内置，离线可用） */
let voiceEn=null;
function pickVoice(){
  const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  /* 优先 en-US 女声（Google/Microsoft 常见命名） */
  voiceEn=vs.find(v=>/en[-_]US/i.test(v.lang)&&/female|zira|aria|samantha|jenny/i.test(v.name))
       ||vs.find(v=>/en[-_]US/i.test(v.lang))
       ||vs.find(v=>/^en/i.test(v.lang))
       ||null;
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;   /* 声音列表异步加载 */
}
let autoSay=true;
function speak(txt){
  if(!window.speechSynthesis){toast("此浏览器不支持语音");return}
  const text=txt||DICTS[curDict][queue[idx]?.word]?.[0];
  if(!text)return;
  speechSynthesis.cancel();   /* 打断上一段 */
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  if(voiceEn)u.voice=voiceEn;
  u.rate=0.85;      /* 学习场景稍慢 */
  u.pitch=1;
  /* 按钮反馈 */
  document.querySelectorAll(".say-btn").forEach(b=>{
    b.classList.add("playing");
    u.onend=u.onerror=()=>b.classList.remove("playing");
  });
  speechSynthesis.speak(u);
}

function flip(){
  flipped=!flipped;
  $("fcard").classList.toggle("flipped",flipped);
}
function mark(known){
  if(idx>=queue.length)return;
  const item=queue[idx];
  if(known){
    item.lv=Math.min(5,item.lv+1);
    stats.know++;
    if(item.lv>=4){
      /* 掌握：移出队列 */
      queue.splice(idx,1);
    }else{
      /* 插到 2^lv 张之后（间隔重复核心） */
      const back=Math.min(queue.length-idx-1,Math.pow(2,item.lv));
      queue.splice(idx,1);
      queue.splice(idx+back,0,item);
    }
  }else{
    item.lv=0;
    stats.forgot++;
    /* 插回 2 张后，立即短间隔重见 */
    const back=Math.min(queue.length-idx-1,2);
    queue.splice(idx,1);
    queue.splice(idx+back,0,item);
  }
  save();
  renderCard();
}
function nextCard(){
  if(idx>=queue.length)return;
  const item=queue[idx];
  queue.splice(idx,1);
  queue.push(item);   /* 跳过→排到队尾 */
  save();renderCard();
}

renderDicts();
load();
if(!queue.length)initQueue();
renderCard();
</script>
</body>
</html>
