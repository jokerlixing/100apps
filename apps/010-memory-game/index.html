<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 记忆翻牌 · Memory Game</title>
<style>
:root{
  --bg:#1a1b26; --panel:#232433; --panel2:#2a2b3d; --line:#363850;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --green:#4ec9b0; --blue:#569cd6; --orange:#e5a663; --purple:#c586c0; --red:#e06c75;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 16px}
.app{width:100%;max-width:640px}
h1{font-size:24px;font-weight:700;margin-bottom:4px}
h1 span{background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}

/* 顶栏 */
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:80px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.stat.moves .v{color:var(--blue)}
.stat.time .v{color:var(--orange)}
.stat.best .v{color:var(--purple);font-size:16px;line-height:1.7}
.modes{display:flex;gap:6px}
.modes button{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:7px 12px;border-radius:14px;cursor:pointer;transition:.15s}
.modes button.on{background:var(--green);border-color:var(--green);color:#12211d;font-weight:700}@media(hover:hover){
.modes button:not(.on):hover{border-color:var(--dim);color:var(--text)}}

/* 棋盘 */
.board{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;perspective:1200px}
/* 卡片：3D 翻转 */
.card3d{position:relative;aspect-ratio:3/4;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.card3d.flipped{transform:rotateY(180deg)}
.card3d.matched{animation:matchPop .4s ease}
@keyframes matchPop{50%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg)}}
.face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:34px;user-select:none}
.back{background:var(--panel2);border:1px solid var(--line);color:var(--dim);transition:.2s}
.card3d:hover .back{border-color:var(--green)}
.front{background:linear-gradient(145deg,#2a3b4d,#233043);border:1px solid var(--blue);transform:rotateY(180deg)}
.card3d.matched .front{border-color:var(--green);background:linear-gradient(145deg,#1f3d35,#1a332c);opacity:.75}

/* 胜利面板 */
.win{display:none;position:fixed;inset:0;background:rgba(26,27,38,.88);z-index:50;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.win.show{display:flex}
.win-card{background:var(--panel);border:1px solid var(--green);border-radius:20px;padding:36px 44px;text-align:center;animation:winIn .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes winIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.win-card .emoji{font-size:56px}
.win-card h2{font-size:22px;margin:10px 0 4px}
.win-card .info{color:var(--muted);font-size:14px;margin-bottom:6px}
.win-card .record{color:var(--purple);font-size:13px;margin-bottom:16px}
.win-card button{background:var(--green);border:none;color:#12211d;padding:12px 32px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}@media(hover:hover){
.win-card button:hover{filter:brightness(1.1)}}

footer{text-align:center;color:var(--dim);font-size:12px;margin-top:16px;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <h1>🃏 <span>记忆翻牌</span></h1>
  <div class="sub">翻开卡片配对 · CSS 3D 翻转 · 三档难度 · 最佳纪录本地保存</div>

  <div class="top">
    <div class="stat moves"><div class="v" id="vMoves">0</div><div class="l">步数</div></div>
    <div class="stat time"><div class="v" id="vTime">0s</div><div class="l">用时</div></div>
    <div class="stat best"><div class="v" id="vBest">—</div><div class="l">最佳（步/秒）</div></div>
    <div class="modes">
      <button class="on" onclick="setLevel(6,3,this)">6对</button>
      <button onclick="setLevel(8,4,this)">8对</button>
      <button onclick="setLevel(12,4,this)">12对</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <footer>100 Apps Challenge · App #010 · 🎉 第一个里程碑达成！· 翻牌用 CSS 3D 变换，一对只能同时翻两张</footer>
</div>

<div class="win" id="win">
  <div class="win-card">
    <div class="emoji">🏆</div>
    <h2>全部配对完成！</h2>
    <div class="info" id="winInfo"></div>
    <div class="record" id="winRecord"></div>
    <button onclick="restart()">🔄 再来一局</button>
  </div>
</div>

<script>
/* ============================================================
   知识点：
   - CSS 3D 翻转：perspective(父) + transform-style:preserve-3d(卡)
     + rotateY(180deg)(翻) + backface-visibility:hidden(藏背面)
   - 游戏状态机：locked 防止连点三张；first/second 记当前一对
   - 发牌：emoji 池取前 N 个 → 复制成对 → Fisher-Yates 洗牌
   ============================================================ */
const POOL=["🍅","⚡","🌟","🎨","🚀","🍀","🎧","🎲","🧩","🔮","🌊","🏔️","🍉","🎸"];
const KEY="memory_v1";
const $=id=>document.getElementById(id);

let pairs=6,cols=3,cards=[],first=null,second=null,locked=false,moves=0,matched=0,startAt=0,timer=null;

/* ---------- 最佳纪录（按难度分开存） ---------- */
function bestKey(){return KEY+"_"+pairs}
function getBest(){try{return JSON.parse(localStorage.getItem(bestKey()))}catch(e){return null}}
function renderBest(){
  const b=getBest();
  $("vBest").textContent=b?`${b.moves}步/${b.sec}s`:"—";
}
function saveBest(m,s){
  const b=getBest();
  if(!b||m<b.moves||(m===b.moves&&s<b.sec)){
    localStorage.setItem(bestKey(),JSON.stringify({moves:m,sec:s}));
    return true;
  }
  return false;
}

/* ---------- 难度 ---------- */
function setLevel(p,c,el){
  pairs=p;cols=c;
  document.querySelectorAll(".modes button").forEach(b=>b.classList.remove("on"));
  el.classList.add("on");
  restart();
}

/* ---------- 发牌 ---------- */
function deal(){
  const chosen=POOL.slice(0,pairs);
  cards=[...chosen,...chosen];
  /* Fisher-Yates 洗牌（每局布局随机） */
  for(let i=cards.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
}

/* ---------- 渲染 ---------- */
function render(){
  $("board").style.gridTemplateColumns=`repeat(${cols},1fr)`;
  $("board").innerHTML=cards.map((c,i)=>`
    <div class="card3d" data-i="${i}" onclick="flip(this)">
      <div class="face back">❓</div>
      <div class="face front">${c}</div>
    </div>`).join("");
}

/* ---------- 翻牌逻辑（状态机） ---------- */
function flip(el){
  if(locked)return;
  const i=+el.dataset.i;
  if(el.classList.contains("flipped"))return;   // 已翻开的不能再点
  if(!startAt){startAt=Date.now();timer=setInterval(tick,500)}
  el.classList.add("flipped");
  if(!first){first=el;return}
  second=el;locked=true;moves++;
  $("vMoves").textContent=moves;
  const a=cards[+first.dataset.i],b=cards[+second.dataset.i];
  if(a===b){
    /* 配对成功：800ms 后标记，解锁 */
    setTimeout(()=>{
      first.classList.add("matched");
      second.classList.add("matched");
      first=second=null;locked=false;
      matched++;
      if(matched===pairs)win();
    },450);
  }else{
    /* 配对失败：短暂展示后翻回 */
    setTimeout(()=>{
      first.classList.remove("flipped");
      second.classList.remove("flipped");
      first=second=null;locked=false;
    },750);
  }
}
function tick(){
  $("vTime").textContent=Math.floor((Date.now()-startAt)/1000)+"s";
}

/* ---------- 胜利 ---------- */
function win(){
  clearInterval(timer);
  const sec=Math.floor((Date.now()-startAt)/1000);
  const isNew=saveBest(moves,sec);
  renderBest();
  $("winInfo").textContent=`${pairs} 对卡片 · ${moves} 步 · ${sec} 秒`;
  $("winRecord").textContent=isNew?"🎉 新纪录！":"继续挑战更快纪录～";
  $("win").classList.add("show");
}

/* ---------- 重开 ---------- */
function restart(){
  clearInterval(timer);
  cards=[];first=second=null;locked=false;moves=0;matched=0;startAt=0;
  $("vMoves").textContent="0";$("vTime").textContent="0s";
  $("win").classList.remove("show");
  deal();render();renderBest();
}

restart();
</script>
</body>
</html>
