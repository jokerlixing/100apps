<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌤 天气仪表盘 · Weather Dashboard</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6; --purple:#c586c0; --orange:#d19a66;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 20%,#1e2230 0%,var(--bg) 65%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:920px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}

/* 搜索区 */
.search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:14px;padding:11px 14px;border-radius:12px;outline:none;transition:.15s;-webkit-user-select:text;user-select:text}
.search-bar input:focus{border-color:var(--gold)}
.search-bar .btn{background:var(--gold);border:none;color:#1a1a22;font-size:14px;font-weight:700;padding:11px 22px;border-radius:12px;cursor:pointer;outline:none;transition:.15s}
.search-bar .btn:hover{filter:brightness(1.1)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.qbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:7px 13px;border-radius:18px;cursor:pointer;transition:.15s;outline:none}
.qbtn:hover{color:var(--gold);border-color:var(--gold)}
.qbtn.on{color:var(--gold);border-color:var(--gold);background:rgba(229,181,103,.1)}

/* 搜索建议下拉 */
.sug-wrap{position:relative;flex:1;min-width:200px}
.sug{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:50;box-shadow:0 12px 32px rgba(0,0,0,.5);display:none}
.sug.show{display:block}
.sug-item{padding:11px 14px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;transition:.1s}
.sug-item:hover{background:rgba(229,181,103,.1)}
.sug-item .adm{font-size:11px;color:var(--dim)}

/* 主卡：当前天气 */
.now{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:14px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.now .w-ico{font-size:74px;line-height:1;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}
.now .w-main{flex:1;min-width:200px}
.now .city{font-size:14px;color:var(--muted);letter-spacing:1px}
.now .temp{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--gold);text-shadow:0 4px 24px rgba(229,181,103,.25)}
.now .temp small{font-size:22px;font-weight:400;color:var(--muted)}
.now .desc{font-size:15px;margin-top:2px}
.now .feel{font-size:12px;color:var(--dim);margin-top:2px}
.now .metrics{display:flex;gap:10px;flex-wrap:wrap}
.metric{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:96px;text-align:center}
.metric .mv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.metric .mk{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:2px}
.metric.h .mv{color:var(--blue)}
.metric.w .mv{color:var(--green)}
.metric.p .mv{color:var(--purple)}
.metric.v .mv{color:var(--orange)}

/* 24h 曲线 */
.chart-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.chart-panel h3{font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:12px}
.chart-scroll{overflow-x:auto}
.chart-scroll svg{min-width:640px;display:block}
.axis text{fill:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}

/* 7日预报 */
.week{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.week h3{font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:12px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;transition:.15s}
.day:hover{border-color:var(--dim);transform:translateY(-2px)}
.day.today{border-color:var(--gold);box-shadow:0 0 14px rgba(229,181,103,.15)}
.day .dw{font-size:11px;color:var(--dim)}
.day .di{font-size:30px;margin:6px 0}
.day .dn{font-size:10.5px;color:var(--muted);line-height:1.4}
.day .dt{font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
.day .dt b{color:var(--text)}
.day .dt span{color:var(--dim)}

.loading{text-align:center;padding:60px 0;color:var(--dim)}
.loading .spin{font-size:36px;animation:spin 1.2s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{text-align:center;padding:40px;color:var(--red);font-size:14px}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}

@media(max-width:560px){
  .now{padding:18px}
  .now .temp{font-size:48px}
  .now .w-ico{font-size:56px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>天气仪表盘</h1>
      <div class="sub">Open-Meteo 实时数据 · 24h 温度曲线 · 7 日预报</div>
    </div>
  </header>

  <div class="search-bar">
    <div class="sug-wrap">
      <input type="text" id="cityInp" placeholder="🔍 输入城市名搜索，如：深圳 / Beijing / 上海" autocomplete="off" oninput="onSearch()">
      <div class="sug" id="sug"></div>
    </div>
    <button class="btn" onclick="doSearch()">查询</button>
  </div>
  <div class="quick" id="quick"></div>

  <div id="main">
    <div class="loading"><span class="spin">🌀</span><div style="margin-top:12px">加载天气数据中…</div></div>
  </div>

  <footer>100 Apps Challenge · App #018 · <b>fetch 异步 API 调用</b>：geocoding 定位 + 天气查询<br>数据来源 Open-Meteo（免费无密钥）· 最后查询城市自动记忆</footer>
</div>

<script>
/* ============================================================
   新知识点：异步 API 调用链（L2 核心能力）
   - fetch + async/await 两步调用：
     ① geocoding API：城市名 → 经纬度（支持中文）
     ② weather API：经纬度 → 天气数据
   - 竞态防护：请求序号 + 只认最新响应（搜索快节奏防串台）
   - WMO 天气码 → 中文描述 + emoji 映射表
   - SVG 折线图：24h 温度曲线（min-max 归一化 + 贝塞尔平滑）
   ============================================================ */
const KEY="weather_city_v1";
const $=id=>document.getElementById(id);
let curCity=null;       /* {name,adm,lat,lon} */
let reqSeq=0;           /* 竞态防护 */
let sugTimer=null;

/* 常用城市快捷按钮 */
const QUICK=[
  {n:"北京",lat:39.9042,lon:116.4074},
  {n:"上海",lat:31.2304,lon:121.4737},
  {n:"广州",lat:23.1291,lon:113.2644},
  {n:"深圳",lat:22.5431,lon:114.0579},
  {n:"杭州",lat:30.2741,lon:120.1551},
  {n:"成都",lat:30.5728,lon:104.0668},
  {n:"武汉",lat:30.5928,lon:114.3055},
  {n:"西安",lat:34.3416,lon:108.9398},
];
/* WMO 天气码映射 */
const WMO={
  0:["晴","☀️"],1:["大致晴朗","🌤"],2:["多云","⛅"],3:["阴","☁️"],
  45:["雾","🌫"],48:["冻雾","🌫"],
  51:["小毛毛雨","🌦"],53:["毛毛雨","🌦"],55:["大毛毛雨","🌧"],
  56:["冻毛毛雨","🌧"],57:["强冻毛毛雨","🌧"],
  61:["小雨","🌦"],63:["中雨","🌧"],65:["大雨","🌧"],
  66:["冻雨","🌧"],67:["强冻雨","🌧"],
  71:["小雪","🌨"],73:["中雪","🌨"],75:["大雪","❄️"],77:["雪粒","🌨"],
  80:["阵雨","🌦"],81:["强阵雨","🌧"],82:["暴雨","⛈"],
  85:["小阵雪","🌨"],86:["大阵雪","❄️"],
  95:["雷暴","⛈"],96:["雷暴伴冰雹","⛈"],99:["强雷暴伴冰雹","⛈"],
};
const wmo=c=>WMO[c]||["未知","🌡"];
const WDIR=["北","东北","东","东南","南","西南","西","西北"];
const windDir=d=>WDIR[Math.round(d/45)%8];

/* ---------- 城市搜索（geocoding + 竞态防护） ---------- */
function onSearch(){
  clearTimeout(sugTimer);
  sugTimer=setTimeout(()=>{
    const q=$("cityInp").value.trim();
    if(q.length<1){$("sug").classList.remove("show");return}
    sugFetch(q);
  },300);   /* 300ms 防抖 */
}
async function sugFetch(q){
  const my=++reqSeq;
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh&format=json`);
    const d=await r.json();
    if(my!==reqSeq)return;   /* 过期响应丢弃 */
    const list=d.results||[];
    if(!list.length){$("sug").classList.remove("show");return}
    $("sug").innerHTML=list.map((c,i)=>`
      <div class="sug-item" onclick="pickCity(${i})" data-i="${i}">
        <span>${c.name}</span><span class="adm">${[c.admin1,c.country].filter(Boolean).join(" · ")}</span>
      </div>`).join("");
    $("sug")._data=list;
    $("sug").classList.add("show");
  }catch(e){/* 静默：搜索失败不打断 */}
}
function pickCity(i){
  const c=$("sug")._data[i];
  $("sug").classList.remove("show");
  $("cityInp").value=c.name;
  curCity={name:c.name,adm:c.admin1||"",lat:c.latitude,lon:c.longitude};
  remember();loadWeather();
}
async function doSearch(){
  const q=$("cityInp").value.trim();
  if(!q)return;
  $("sug").classList.remove("show");
  const my=++reqSeq;
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=zh&format=json`);
  const d=await r.json();
  if(my!==reqSeq)return;
  if(!d.results||!d.results.length){
    $("main").innerHTML=`<div class="err">找不到「${esc(q)}」，试试其他名称 🤔</div>`;
    return;
  }
  const c=d.results[0];
  curCity={name:c.name,adm:c.admin1||"",lat:c.latitude,lon:c.longitude};
  remember();loadWeather();
}
document.addEventListener("click",e=>{
  if(!e.target.closest(".sug-wrap"))$("sug").classList.remove("show");
});
$("cityInp").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()});

function remember(){try{localStorage.setItem(KEY,JSON.stringify(curCity))}catch(e){}}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}

/* ---------- 天气加载 ---------- */
async function loadWeather(){
  if(!curCity)return;
  const my=++reqSeq;
  $("main").innerHTML=`<div class="loading"><span class="spin">🌀</span><div style="margin-top:12px">加载 ${esc(curCity.name)} 的天气…</div></div>`;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${curCity.lat}&longitude=${curCity.lon}`+
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,visibility`+
      `&hourly=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=auto`;
    const r=await fetch(url);
    if(!r.ok)throw new Error("API "+r.status);
    const d=await r.json();
    if(my!==reqSeq)return;
    render(d);
  }catch(e){
    if(my!==reqSeq)return;
    $("main").innerHTML=`<div class="err">天气数据加载失败：${esc(e.message)}<br>请检查网络后重试</div>`;
  }
}

/* ---------- 渲染 ---------- */
function render(d){
  const c=d.current;
  const [txt,ico]=wmo(c.weather_code);
  const hour=new Date().getHours();
  const dayIco=(hour<6||hour>=18)&&c.weather_code===0?"🌙":ico;  /* 夜晚晴天换月亮 */

  /* 当前天气卡 */
  let html=`
  <div class="now">
    <div class="w-ico">${dayIco}</div>
    <div class="w-main">
      <div class="city">📍 ${esc(curCity.name)}${curCity.adm?" · "+esc(curCity.adm):""}</div>
      <div class="temp">${Math.round(c.temperature_2m)}<small>°C</small></div>
      <div class="desc">${txt} · 体感 ${Math.round(c.apparent_temperature)}°C</div>
    </div>
    <div class="metrics">
      <div class="metric h"><div class="mv">${c.relative_humidity_2m}%</div><div class="mk">湿度</div></div>
      <div class="metric w"><div class="mv">${c.wind_speed_10m}<span style="font-size:11px;font-weight:400"> km/h</span></div><div class="mk">风速 ${windDir(c.wind_direction_10m)}风</div></div>
      <div class="metric p"><div class="mv">${Math.round(c.pressure_msl)}</div><div class="mk">气压 hPa</div></div>
      <div class="metric v"><div class="mv">${(c.visibility/1000).toFixed(1)}<span style="font-size:11px;font-weight:400"> km</span></div><div class="mk">能见度</div></div>
    </div>
  </div>`;

  /* 24h 温度曲线（SVG 折线 + 渐变填充） */
  const nowH=new Date().getHours();
  const temps=d.hourly.temperature_2m.slice(nowH,nowH+24);
  const times=d.hourly.time.slice(nowH,nowH+24).map(t=>+t.slice(11,13));
  html+=chartHTML(temps,times);

  /* 7 日预报 */
  const wd=["日","一","二","三","四","五","六"];
  const today=new Date().getDay();
  html+=`<div class="week"><h3>📅 未来 7 天预报</h3><div class="days">`+
    d.daily.time.map((t,i)=>{
      const [t2,i2]=wmo(d.daily.weather_code[i]);
      const dlabel=i===0?"今天":`周${wd[(today+i)%7]}`;
      return `<div class="day ${i===0?'today':''}">
        <div class="dw">${dlabel}</div>
        <div class="di">${i===0&&hour>=18?i2:i2}</div>
        <div class="dn">${t2}</div>
        <div class="dt"><b>${Math.round(d.daily.temperature_2m_max[i])}°</b> <span>/ ${Math.round(d.daily.temperature_2m_min[i])}°</span></div>
      </div>`;
    }).join("")+`</div></div>`;

  $("main").innerHTML=html;
  renderQuick();
}

/* SVG 温度曲线 */
function chartHTML(temps,hours){
  const W=680,H=170,P=34;
  const min=Math.min(...temps),max=Math.max(...temps);
  const span=Math.max(1,max-min);
  const x=i=>P+i*(W-P*2)/(temps.length-1);
  const y=t=>H-34-(t-min)/span*(H-70);
  /* 贝塞尔平滑路径 */
  let path=`M ${x(0)} ${y(temps[0])}`;
  for(let i=1;i<temps.length;i++){
    const cx=(x(i-1)+x(i))/2;
    path+=` C ${cx} ${y(temps[i-1])}, ${cx} ${y(temps[i])}, ${x(i)} ${y(temps[i])}`;
  }
  const fill=path+` L ${x(temps.length-1)} ${H-20} L ${x(0)} ${H-20} Z`;
  /* 标注：最高/最低点 + 每 6h 刻度 */
  const iMax=temps.indexOf(max),iMin=temps.indexOf(min);
  let ticks="";
  for(let i=0;i<hours.length;i+=6){
    ticks+=`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${hours[i]}时</text>
    <line x1="${x(i)}" y1="${H-16}" x2="${x(i)}" y2="${H-12}" stroke="var(--line)"/>`;
  }
  return `<div class="chart-panel"><h3>🌡 未来 24 小时温度</h3>
  <div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5b567" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#e5b567" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${fill}" fill="url(#tg)"/>
    <path d="${path}" fill="none" stroke="#e5b567" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${x(iMax)}" cy="${y(max)}" r="4" fill="var(--red)"/>
    <text x="${x(iMax)}" y="${y(max)-9}" text-anchor="middle" fill="var(--red)" font-size="11" font-weight="700">${Math.round(max)}°</text>
    <circle cx="${x(iMin)}" cy="${y(min)}" r="4" fill="var(--blue)"/>
    <text x="${x(iMin)}" y="${y(min)+18}" text-anchor="middle" fill="var(--blue)" font-size="11" font-weight="700">${Math.round(min)}°</text>
    <g class="axis">${ticks}</g>
  </svg></div></div>`;
}

/* 快捷城市按钮高亮 */
function renderQuick(){
  $("quick").innerHTML=QUICK.map((q,i)=>
    `<button class="qbtn ${curCity&&curCity.name===q.n?'on':''}" onclick="quickPick(${i})">${q.n}</button>`
  ).join("");
}
function quickPick(i){
  const q=QUICK[i];
  curCity={name:q.n,adm:"",lat:q.lat,lon:q.lon};
  $("cityInp").value=q.n;
  remember();loadWeather();
}

/* ---------- 启动：记忆上次城市，否则默认广州 ---------- */
try{
  const s=JSON.parse(localStorage.getItem(KEY));
  if(s&&s.lat)curCity=s;
}catch(e){}
if(!curCity)curCity={name:"广州",adm:"广东",lat:23.1291,lon:113.2644};
$("cityInp").value=curCity.name;
renderQuick();
loadWeather();
</script>
</body>
</html>
