<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 单位换算器 · Unit Converter</title>
<style>
:root{
  --bg:#1a1b26; --panel:#232433; --panel2:#2a2b3d; --line:#363850;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --green:#4ec9b0; --blue:#569cd6; --orange:#e5a663; --purple:#c586c0; --red:#e06c75;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
.app{width:100%;max-width:560px}
h1{font-size:24px;font-weight:700;margin-bottom:4px}
h1 span{background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}

/* 类别选择 */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;padding:8px 16px;border-radius:20px;cursor:pointer;transition:.15s}
.cat.on{background:var(--blue);border-color:var(--blue);color:#12131a;font-weight:600}
.cat:not(.on):hover{border-color:var(--dim);color:var(--text)}

/* 换算卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:flex;gap:10px;align-items:center}
.row select,.row input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-size:15px;outline:none;transition:.15s}
.row select{width:150px;cursor:pointer}
.row input{flex:1;min-width:0;font-family:Consolas,monospace}
.row select:focus,.row input:focus{border-color:var(--green)}
.swap{display:flex;justify-content:center;margin:12px 0}
.swap button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer;transition:.2s}
.swap button:hover{border-color:var(--green);color:var(--green);transform:rotate(180deg)}
.result{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.8;word-break:break-all}
.result b{color:var(--green);font-size:15px}

/* 常用换算速查 */
.quick{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.quick h4{font-size:12px;color:var(--dim);margin-bottom:10px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-item{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:8px;padding:9px 12px;font-size:12px;cursor:pointer;transition:.15s}
.q-item:hover{border:1px solid var(--blue)}
.q-item .k{color:var(--muted)}
.q-item .v{color:var(--blue);font-family:Consolas,monospace}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:16px;line-height:1.8}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--green);color:var(--text);padding:12px 24px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="app">
  <h1>📐 <span>单位换算器</span></h1>
  <div class="sub">长度 · 重量 · 温度 · 面积 · 体积 · 速度 · 数据量 · 点击结果一键复制</div>

  <div class="cats" id="cats"></div>

  <div class="card">
    <div class="row">
      <input type="number" id="fromVal" value="1" step="any">
      <select id="fromUnit"></select>
    </div>
    <div class="swap"><button onclick="swap()" title="交换单位">⇅</button></div>
    <div class="row">
      <input type="text" id="toVal" readonly value="—">
      <select id="toUnit"></select>
    </div>
    <div class="result" id="formula"></div>
    <div class="quick" id="quick"></div>
  </div>

  <footer>100 Apps Challenge · App #006 · 单位数据内置本地换算，无需联网</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   设计模式：基准单位归一化
   每类单位只定义"与基准单位的换算系数"，任意两单位换算 = 先转基准再转目标
   温度是仿射变换（有截距），单独用 toBase/fromBase 函数处理
   ============================================================ */
const CATEGORIES={
  长度:{base:"米",units:{
    千米:1000,米:1,分米:0.1,厘米:0.01,毫米:0.001,微米:1e-6,纳米:1e-9,
    英里:1609.344,码:0.9144,英尺:0.3048,英寸:0.0254,"海里":1852,
    里:500,丈:3.3333,尺:0.33333,寸:0.033333
  }},
  重量:{base:"千克",units:{
    吨:1000000,千克:1000,克:1,毫克:0.001,微克:1e-6,
    磅:453.59237,盎司:28.349523,"斤":500,"两":50
  }},
  面积:{base:"平方米",units:{
    "平方千米":1e6,"平方米":1,"平方分米":0.01,"平方厘米":1e-4,
    公顷:10000,亩:666.667,"平方英里":2589988.11,"平方英尺":0.09290304
  }},
  体积:{base:"升",units:{
    "立方米":1000,升:1,毫升:0.001,
    "加仑(美)":3.785412,"加仑(英)":4.54609,"品脱(美)":0.4731763,杯:0.2365882
  }},
  速度:{base:"米/秒",units:{
    "米/秒":1,"千米/时":0.277778,"英里/时":0.44704,
    "节(海里/时)":0.514444,"马赫":340.29,"光速":299792458
  }},
  数据量:{base:"字节",units:{
    比特:0.125,字节:1,KB:1024,MB:1048576,GB:1073741824,
    TB:1099511627776,PB:1125899906842624
  }},
  温度:{base:"摄氏度",affine:true,units:{
    "摄氏度":{toBase:v=>v,fromBase:v=>v},
    "华氏度":{toBase:v=>(v-32)*5/9,fromBase:v=>v*9/5+32},
    "开尔文":{toBase:v=>v-273.15,fromBase:v=>v+273.15}
  }}
};

const $=id=>document.getElementById(id);
let curCat="长度";

/* ---------- 类别标签 ---------- */
function renderCats(){
  $("cats").innerHTML=Object.keys(CATEGORIES).map(c=>
    `<button class="cat ${c===curCat?"on":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){
  curCat=c;renderCats();
  const units=Object.keys(CATEGORIES[c].units);
  fillSelect($("fromUnit"),units,units[1]||units[0]);
  fillSelect($("toUnit"),units,units[2]||units[1]||units[0]);
  convert();renderQuick();
}
function fillSelect(sel,units,def){
  sel.innerHTML=units.map(u=>`<option ${u===def?"selected":""}>${u}</option>`).join("");
}

/* ---------- 核心换算 ---------- */
function convert(){
  const cat=CATEGORIES[curCat];
  const v=parseFloat($("fromVal").value);
  const from=$("fromUnit").value,to=$("toUnit").value;
  if(isNaN(v)){$("toVal").value="—";$("formula").textContent="";return}
  let result,formula;
  if(cat.affine){
    result=cat.units[to].fromBase(cat.units[from].toBase(v));
  }else{
    result=v*cat.units[from]/cat.units[to];
  }
  const shown=Math.abs(result)>=1e15||(Math.abs(result)<1e-9&&result!==0)
    ?result.toExponential(8):+result.toFixed(8)+"";
  $("toVal").value=shown;
  $("formula").innerHTML=`<b>${fmtNum(v)}</b> ${from} = <b>${fmtNum(result)}</b> ${to}`;
  $("toVal").dataset.raw=result;
}
function fmtNum(n){
  if(Math.abs(n)>=1e15||(Math.abs(n)<1e-9&&n!==0))return n.toExponential(4);
  return(+n.toPrecision(12)).toString();
}

/* ---------- 交换 ---------- */
function swap(){
  const f=$("fromUnit").value;
  $("fromUnit").value=$("toUnit").value;
  $("toUnit").value=f;
  const raw=$("toVal").dataset.raw;
  if(raw!==undefined&&raw!=="")$("fromVal").value=+raw;
  convert();
}

/* ---------- 常用速查（当前类别） ---------- */
function renderQuick(){
  const cat=CATEGORIES[curCat];
  const quickMap={
    长度:[["1 英里","英里","千米"],["1 英尺","英尺","厘米"],["1 海里","海里","千米"]],
    重量:[["1 磅","磅","千克"],["1 斤","斤","千克"],["1 盎司","盎司","克"]],
    面积:[["1 公顷","公顷","亩"],["1 亩","亩","平方米"]],
    体积:[["1 加仑(美)","加仑(美)","升"],["1 杯","杯","毫升"]],
    速度:[["1 马赫","马赫","千米/时"],["60 千米/时→？","千米/时","米/秒"]],
    数据量:[["1 GB","GB","MB"],["1 TB","TB","GB"]],
    温度:[["体温 98.6°F","98.6","摄氏度"]]
  };
  const items=quickMap[curCat]||[];
  $("quick").innerHTML=`<h4>📌 ${curCat}常用速查（点击填充）</h4><div class="quick-grid">`+
    items.map(it=>{
      if(curCat==="温度"){
        const c=CATEGORIES.温度.units["华氏度"].toBase(parseFloat(it[1]));
        return `<div class="q-item" onclick="quickTemp()"><span class="k">${it[0]}</span><span class="v">${fmtNum(c)}°C</span></div>`;
      }
      const u=cat.units;
      const val=parseFloat((it[0].match(/[\d.]+/)||["1"])[0]);
      const fromUnit=it[1];
      const res=val*u[fromUnit]/u[it[2]];
      return `<div class="q-item" onclick="quickFill('${fromUnit}','${it[2]}',${val})"><span class="k">${val} ${fromUnit}</span><span class="v">${fmtNum(res)} ${it[2]}</span></div>`;
    }).join("")+"</div>";
}
function quickFill(from,to,val){
  $("fromUnit").value=from;$("toUnit").value=to;$("fromVal").value=val;
  convert();toast(`已填入 ${val} ${from} → ${to}`);
}
function quickTemp(){
  $("fromUnit").value="华氏度";$("toUnit").value="摄氏度";$("fromVal").value=98.6;
  convert();toast("已填入体温换算 98.6°F → 摄氏度");
}

/* ---------- 复制 ---------- */
$("toVal").addEventListener("click",()=>{
  const raw=$("toVal").dataset.raw;
  if(!raw){toast("没有可复制的结果");return}
  const text=fmtNum(+raw);
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("📋 已复制 "+text));
  else toast("复制失败，请手动选择");
});

/* ---------- 事件 ---------- */
$("fromVal").addEventListener("input",convert);
$("fromUnit").addEventListener("change",convert);
$("toUnit").addEventListener("change",convert);

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- 启动：默认 1 英里 = ? 千米 ---------- */
setCat("长度");
$("fromUnit").value="英里";$("toUnit").value="千米";
convert();renderQuick();
</script>
</body>
</html>
