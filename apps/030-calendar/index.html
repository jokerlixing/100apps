<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 日历应用 · Calendar</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6; --purple:#c586c0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-anchor:none}
body{background:radial-gradient(ellipse at 50% 0%,#1e2230 0%,var(--bg) 60%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:760px;margin:0 auto}

/* ===== 头部：大标题 + 阴历风格年月 ===== */
header{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.h-left{display:flex;flex-direction:column;gap:3px}
h1{font-size:21px;font-weight:800;letter-spacing:4px;color:var(--gold)}
.sub{color:var(--muted);font-size:11px;letter-spacing:2px}

/* 导航区 */
.nav{display:flex;align-items:center;gap:8px}
.nav .arrow{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:16px;width:34px;height:34px;border-radius:10px;cursor:pointer;outline:none;display:flex;align-items:center;justify-content:center}
@media(hover:hover){.nav .arrow:hover{border-color:var(--gold);color:var(--gold);background:rgba(229,181,103,.08)}}
.nav .arrow:active{transform:scale(.92)}
.nav .ym{font-size:17px;font-weight:800;min-width:112px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.nav .ym small{display:block;font-size:9px;color:var(--dim);font-weight:400;letter-spacing:2px;margin-top:1px}
.today-btn{background:linear-gradient(135deg,#e5b567,#d4a04e);border:none;color:#1a1a22;font-size:12px;font-weight:800;padding:8px 18px;border-radius:18px;cursor:pointer;outline:none;box-shadow:0 3px 12px rgba(229,181,103,.3);letter-spacing:1px}
@media(hover:hover){.today-btn:hover{filter:brightness(1.1);box-shadow:0 4px 16px rgba(229,181,103,.45)}}
.today-btn:active{transform:scale(.95)}

/* 星期头 */
.week-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.week-head div{text-align:center;font-size:11px;color:var(--dim);letter-spacing:2px;padding:7px 0;font-weight:600}
.week-head .wk{color:var(--red)}

/* ===== 月格精修 ===== */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:76px;padding:9px;cursor:pointer;position:relative;transition:border-color .15s;display:flex;flex-direction:column;align-items:center;overflow:hidden}
@media(hover:hover){.cell:hover{border-color:var(--dim);background:var(--panel2)}}
.cell.other{opacity:.3;background:transparent}
.cell.other .d{color:var(--dim)}
/* 今天：金色徽章 + 边框光晕 */
.cell.today{border-color:var(--gold);box-shadow:0 0 14px rgba(229,181,103,.18),inset 0 0 20px rgba(229,181,103,.05)}
.cell.today .d{background:linear-gradient(135deg,#e5b567,#d49a3e);color:#1a1a22;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800}
/* 选中：蓝框 */
.cell.sel{border-color:var(--blue);box-shadow:0 0 14px rgba(86,156,214,.22)}
.cell.sel .d::after{content:"";position:absolute}
.cell .d{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cell .d.wknd{color:var(--red)}
.cell.today .d.wknd{color:#1a1a22}
.cell .evs{margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:2.5px;overflow:hidden;width:100%}
.dot-ev{font-size:9.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:2px 7px;border-radius:6px;background:rgba(86,156,214,.16);color:var(--blue);border-left:2px solid currentColor}
.dot-ev.more{background:transparent;color:var(--dim);border-left-color:transparent}

/* ===== 事件面板 ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.panel h3{font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.panel h3 .sel-date{color:var(--gold);font-size:14px;font-weight:700;letter-spacing:1px;background:rgba(229,181,103,.1);padding:4px 14px;border-radius:14px;border:1px solid rgba(229,181,103,.3)}
.add-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.add-row input[type=text]{flex:1;min-width:140px;background:rgba(0,0,0,.22);border:1px solid var(--line);color:var(--text);font-size:13px;padding:10px 14px;border-radius:11px;outline:none;-webkit-user-select:text;user-select:text}
.add-row input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(229,181,103,.1)}
.add-row select{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:12px;padding:10px;border-radius:11px;outline:none;cursor:pointer}
.add-btn{background:linear-gradient(135deg,#e5b567,#d4a04e);border:none;color:#1a1a22;font-size:12px;font-weight:800;padding:10px 20px;border-radius:11px;cursor:pointer;outline:none;box-shadow:0 3px 10px rgba(229,181,103,.25)}
@media(hover:hover){.add-btn:hover{filter:brightness(1.1)}}
.add-btn:active{transform:scale(.95)}
.ev-list{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:11px;background:var(--panel2);border-radius:11px;padding:11px 14px;border-left:3px solid var(--blue);transition:.15s}
.ev .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.ev .tx{flex:1;font-size:13px;word-break:break-all}
.ev .tm{font-size:10px;color:var(--dim);background:rgba(255,255,255,.05);padding:2px 9px;border-radius:9px;letter-spacing:1px}
.ev .del{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:4px 9px;border-radius:7px;outline:none}
@media(hover:hover){.ev .del:hover{color:var(--red)}}
.ev .del.armed{color:var(--red);border:1px solid var(--red)}
.no-ev{color:var(--dim);font-size:12px;text-align:center;padding:16px;letter-spacing:1px}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}
@media(max-width:560px){
  header{padding:14px 16px}
  .nav{width:100%;justify-content:space-between}
  .cell{min-height:56px;padding:6px}
  .cell .d,.cell.today .d{font-size:12px;width:22px;height:22px}
  .dot-ev{display:none}
  .cell .evs{flex-direction:row;gap:3px;margin-top:4px}
  .evdot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="h-left">
      <h1>📅 日历</h1>
      <div class="sub">CALENDAR · 月视图 · 事件标记</div>
    </div>
    <div class="nav">
      <button class="arrow" onclick="moveMonth(-1)" title="上个月">‹</button>
      <div class="ym" id="ym">—<small>YEAR / MONTH</small></div>
      <button class="arrow" onclick="moveMonth(1)" title="下个月">›</button>
      <button class="today-btn" onclick="goToday()">● 今天</button>
    </div>
  </header>

  <div class="week-head">
    <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="wk">六</div><div class="wk">日</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="panel">
    <h3>📝 当日事件 <span class="sel-date" id="selDate">—</span></h3>
    <div class="add-row">
      <input type="text" id="evTxt" placeholder="事件内容，如：团队周会" maxlength="40" onkeydown="if(event.key==='Enter')addEvent()">
      <select id="evColor">
        <option value="blue">🔵 蓝</option>
        <option value="green">🟢 绿</option>
        <option value="gold">🟡 金</option>
        <option value="red">🔴 红</option>
        <option value="purple">🟣 紫</option>
      </select>
      <button class="add-btn" onclick="addEvent()">＋ 添加</button>
    </div>
    <div class="ev-list" id="evList"></div>
  </div>

  <footer>100 Apps Challenge · App #030 · 🎉 <b>30% 里程碑</b> · 月视图 6 周网格（前补上月尾/后补下月头）<br>事件数据 events{date:[{text,color}]} · localStorage 持久化 · 五色标记</footer>
</div>

<script>
/* ============================================================
   核心知识点：月历网格生成
   - JS Date 的 getDay() 周日=0，转周一制：(day+6)%7
   - 月视图 42 格 = 6 行 × 7 列：前补上月尾/后补下月头
   - 事件按日期分组存 events{ "2026-08-28":[{text,color}] }
   ============================================================ */
const $=id=>document.getElementById(id);
const KEY="calendar_v1";
const COLORS={blue:"#569cd6",green:"#4ec9b0",gold:"#e5b567",red:"#e06c75",purple:"#c586c0"};
const COLOR_CN={blue:"蓝",green:"绿",gold:"金",red:"红",purple:"紫"};

let viewY,viewM;
let selDate=null;
let events={};

try{events=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){}}

function dstr2(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
const WD=["一","二","三","四","五","六","日"];

function init(){
  const t=new Date();
  viewY=t.getFullYear();viewM=t.getMonth();
  selDate=dstr2(viewY,viewM,t.getDate());
}
function moveMonth(n){
  viewM+=n;
  if(viewM<0){viewM=11;viewY--}
  if(viewM>11){viewM=0;viewY++}
  render();
}
function goToday(){
  const t=new Date();
  viewY=t.getFullYear();viewM=t.getMonth();
  selDate=dstr2(viewY,viewM,t.getDate());
  render();
  toast("已回到今天 📍");
}

/* ---------- 渲染 ---------- */
function render(){
  $("ym").innerHTML=viewY+" 年 "+(viewM+1)+" 月<small>YEAR / MONTH</small>";
  const today=new Date();
  const todayS=dstr2(today.getFullYear(),today.getMonth(),today.getDate());
  const firstDow=(new Date(viewY,viewM,1).getDay()+6)%7;
  const start=new Date(viewY,viewM,1-firstDow);
  let html="";
  for(let i=0;i<42;i++){
    const cur=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const ds=dstr2(cur.getFullYear(),cur.getMonth(),cur.getDate());
    const inMonth=cur.getMonth()===viewM;
    const isToday=ds===todayS;
    const isSel=ds===selDate;
    const isWknd=cur.getDay()===0||cur.getDay()===6;
    const evs=events[ds]||[];
    let evHtml="";
    if(evs.length){
      evHtml=evs.slice(0,2).map(e=>
        `<span class="dot-ev" style="background:${COLORS[e.color]}1f;color:${COLORS[e.color]}">${esc(e.text)}</span>`
      ).join("");
      if(evs.length>2)evHtml+=`<span class="dot-ev more">+${evs.length-2} 更多</span>`;
      evHtml+=`<span class="evdot" style="background:${COLORS[evs[0].color]};display:none"></span>`;
    }
    html+=`<div class="cell ${inMonth?"":"other"} ${isToday?"today":""} ${isSel?"sel":""}" onclick="pick('${ds}')">
      <div class="d ${isWknd?"wknd":""}">${cur.getDate()}</div>
      <div class="evs">${evHtml}</div>
    </div>`;
  }
  $("grid").innerHTML=html;
  renderEvents();
}
function pick(ds){
  selDate=ds;
  render();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- 事件 CRUD ---------- */
function addEvent(){
  const txt=$("evTxt").value.trim();
  if(!txt){toast("先写事件内容 📝");return}
  if(!selDate){toast("先选一个日期");return}
  if(!events[selDate])events[selDate]=[];
  if(events[selDate].some(e=>e.text===txt)){toast("该日已有同名事件");return}
  events[selDate].push({text:txt,color:$("evColor").value});
  $("evTxt").value="";
  save();render();
  toast("已添加 ✅");
}
let delArmed=null,delTimer=null;
function delEvent(ds,i,btn){
  if(delArmed!==ds+"-"+i){
    delArmed=ds+"-"+i;
    if(btn){btn.classList.add("armed");btn.textContent="确认?"}
    clearTimeout(delTimer);
    delTimer=setTimeout(()=>{delArmed=null;if(btn){btn.classList.remove("armed");btn.textContent="✕"}},2500);
    return;
  }
  clearTimeout(delTimer);delArmed=null;
  events[ds].splice(i,1);
  if(!events[ds].length)delete events[ds];
  save();render();
  toast("已删除");
}

/* ---------- 选中日事件列表 ---------- */
function renderEvents(){
  const d=selDate?new Date(selDate+"T00:00"):null;
  $("selDate").textContent=selDate?`${selDate.slice(5).replace("-","/")} 周${WD[(d.getDay()+6)%7]}`:"—";
  const list=selDate?(events[selDate]||[]):[];
  $("evList").innerHTML=list.length?list.map((e,i)=>
    `<div class="ev" style="border-left-color:${COLORS[e.color]}">
      <span class="sw" style="background:${COLORS[e.color]};color:${COLORS[e.color]}"></span>
      <span class="tx">${esc(e.text)}</span>
      <span class="tm">${COLOR_CN[e.color]}</span>
      <button class="del" onclick="delEvent('${selDate}',${i},this)">✕</button>
    </div>`
  ).join(""):`<div class="no-ev">这天还没有事件，上方添加一个吧</div>`;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  let t=document.getElementById("toastBox");
  if(!t){
    t=document.createElement("div");t.id="toastBox";
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 22px;border-radius:11px;font-size:13px;z-index:99";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{const el=document.getElementById("toastBox");if(el)el.remove()},1600);
}

init();
render();
</script>
</body>
</html>
