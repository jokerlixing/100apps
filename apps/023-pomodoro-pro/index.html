<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏰ 番茄钟 Pro · Pomodoro Pro</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6; --purple:#c586c0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 20%,#1e2230 0%,var(--bg) 65%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.app{width:100%;max-width:860px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}

.main-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:760px){.main-cols{grid-template-columns:1fr}}

/* 计时区 */
.timer-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mode-tabs{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:18px}
.mode-tabs button{flex:1;background:var(--panel2);border:none;color:var(--muted);font-size:13px;padding:10px;cursor:pointer;transition:.15s;outline:none}
.mode-tabs button.on{font-weight:700}
.mode-tabs button.on[data-m="focus"]{background:rgba(229,181,103,.15);color:var(--gold)}
.mode-tabs button.on[data-m="short"]{background:rgba(78,201,176,.15);color:var(--green)}
.mode-tabs button.on[data-m="long"]{background:rgba(86,156,214,.15);color:var(--blue)}

.ring-wrap{position:relative;width:230px;height:230px;margin:0 auto 18px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10}
.ring-fg{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .3s}
.mode-short .ring-fg{stroke:var(--green)}
.mode-long .ring-fg{stroke:var(--blue)}
.time-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time-num .t{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px}
.time-num .l{font-size:11px;color:var(--dim);letter-spacing:3px;margin-top:4px}

.ctrl-row{display:flex;gap:10px;justify-content:center}
.btn{background:var(--gold);border:none;color:#1a1a22;font-size:14px;font-weight:700;padding:11px 26px;border-radius:11px;cursor:pointer;outline:none;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-weight:400;font-size:13px;padding:11px 18px}
.btn.sec:hover{color:var(--gold);border-color:var(--gold)}

.pomo-stats{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:11px;color:var(--dim)}
.pomo-stats b{color:var(--gold)}
.task-hint{margin-top:10px;font-size:12px;color:var(--muted);min-height:18px}
.task-hint b{color:var(--purple)}

/* 任务区 */
.task-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.task-panel h3{font-size:13px;color:var(--muted);letter-spacing:2px;margin-bottom:12px}
.add-row{display:flex;gap:8px;margin-bottom:12px}
.add-row input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13px;padding:9px 12px;border-radius:9px;outline:none;-webkit-user-select:text;user-select:text}
.add-row input:focus{border-color:var(--gold)}
.add-row button{background:var(--gold);border:none;color:#1a1a22;font-size:12px;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;outline:none}
.task-list{max-height:250px;overflow-y:auto}
.task-list::-webkit-scrollbar{width:5px}
.task-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.task{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:6px;background:var(--panel2);border:1px solid transparent;transition:.15s;cursor:pointer}
.task:hover{border-color:var(--dim)}
.task.cur{border-color:var(--purple);box-shadow:0 0 12px rgba(197,134,192,.18)}
.task .radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--dim);flex-shrink:0;transition:.15s}
.task.cur .radio{border-color:var(--purple);background:var(--purple);box-shadow:0 0 8px rgba(197,134,192,.5)}
.task .nm{flex:1;font-size:13px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .cnt{font-size:10px;color:var(--dim);background:rgba(229,181,103,.12);color:var(--gold);padding:2px 8px;border-radius:9px;font-variant-numeric:tabular-nums}
.task .del{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:3px 6px;border-radius:6px;outline:none}
.task .del:hover{color:var(--red)}
.task .del.armed{color:var(--red);border:1px solid var(--red)}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:14px}

/* 周图表 */
.week-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;grid-column:1/-1}
.week-panel h3{font-size:13px;color:var(--muted);letter-spacing:2px;margin-bottom:14px;display:flex;justify-content:space-between}
.week-panel h3 span{color:var(--gold)}
.chart{display:flex;gap:10px;align-items:flex-end;height:130px;padding:0 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:44px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--gold),rgba(229,181,103,.35));min-height:3px;transition:height .4s ease;position:relative}
.bar.today{background:linear-gradient(180deg,var(--green),rgba(78,201,176,.35));box-shadow:0 0 12px rgba(78,201,176,.3)}
.bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.today .val{color:var(--green)}
.bar-label{font-size:10px;color:var(--dim)}
.bar-label.today{color:var(--green);font-weight:700}
.week-total{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
.week-total b{color:var(--gold)}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:18px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>番茄钟 Pro</h1>
      <div class="sub">关联任务 · 番茄计数 · 每周专注图表</div>
    </div>
  </header>

  <div class="main-cols">
    <div class="timer-panel" id="timerPanel">
      <div class="mode-tabs">
        <button class="on" data-m="focus" onclick="setMode('focus')">🍅 专注 25分</button>
        <button data-m="short" onclick="setMode('short')">☕ 小憩 5分</button>
        <button data-m="long" onclick="setMode('long')">🛌 长休 15分</button>
      </div>
      <div class="ring-wrap">
        <svg width="230" height="230">
          <circle class="ring-bg" cx="115" cy="115" r="100"/>
          <circle class="ring-fg" id="ringFg" cx="115" cy="115" r="100" stroke-dasharray="628" stroke-dashoffset="0"/>
        </svg>
        <div class="time-num">
          <div class="t" id="timeNum">25:00</div>
          <div class="l" id="modeLabel">FOCUS</div>
        </div>
      </div>
      <div class="ctrl-row">
        <button class="btn" id="startBtn" onclick="toggleTimer()">▶ 开始专注</button>
        <button class="btn sec" onclick="resetTimer()">↻ 重置</button>
      </div>
      <div class="pomo-stats">今日番茄 <b id="pomoToday">0</b> 个 · 累计专注 <b id="minToday">0</b> 分钟</div>
      <div class="task-hint" id="taskHint">👆 先在右侧选一个任务再开始</div>
    </div>

    <div class="task-panel">
      <h3>📋 任务清单（点击关联当前番茄钟）</h3>
      <div class="add-row">
        <input type="text" id="taskInp" placeholder="输入任务名，如：写周报" maxlength="30" onkeydown="if(event.key==='Enter')addTask()">
        <button onclick="addTask()">＋ 添加</button>
      </div>
      <div class="task-list" id="taskList"></div>
    </div>

    <div class="week-panel">
      <h3>📊 本周专注时长 <span id="weekRange"></span></h3>
      <div class="chart" id="chart"></div>
      <div class="week-total">本周合计 <b id="weekTotal">0</b> 分钟 · 完成 <b id="weekPomos">0</b> 个番茄</div>
    </div>
  </div>

  <footer>100 Apps Challenge · App #023 · <b>状态机计时器</b>：三模式循环 focus→short（每4个→long）<br>任务关联 · SVG 环形进度（C=2πr）· 周视图按日期聚合 · 数据全存 localStorage</footer>
</div>

<script>
/* ============================================================
   新知识点：状态机计时器 + 数据聚合
   - 三态循环：focus(25) → short(5)，每 4 个 focus → long(15)
   - 计时精度：endTime 时间戳锚定（不受切后台/节流影响）
     不用 setInterval 累加（切后台会慢）
   - 数据聚合：history 记录 {date, minutes, pomos}
     周图表 = 近7天 group by 日期，SVG-free 纯 div 柱状图
   - 任务关联：curTaskId → 番茄完成时对应任务 count+1
   ============================================================ */
const $=id=>document.getElementById(id);
const KEY="pomopro_v1";
const MODES={
  focus:{min:25,label:"FOCUS",next:"short"},
  short:{min:5,label:"SHORT BREAK",next:"focus"},
  long:{min:15,label:"LONG BREAK",next:"focus"},
};
const C=2*Math.PI*100;   /* 环形周长 628 */

let mode="focus";
let running=false;
let endTime=0;            /* 结束时间戳（精度锚） */
let leftMs=MODES.focus.min*60000;   /* 剩余毫秒 */
let timerIv=null;
let focusCount=0;         /* 今日番茄数（决定长休） */
let tasks=[];             /* [{id,name,count,done}] */
let curTaskId=null;
let history=[];           /* [{date:'2026-08-27',minutes,pomos}] */

/* ---------- 持久化 ---------- */
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({tasks,history,focusCount}))}catch(e){}
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s){
      tasks=s.tasks||[];
      history=s.history||[];
      focusCount=s.focusCount||0;
    }
  }catch(e){}
}

/* ---------- 日期工具 ---------- */
function todayStr(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dayCN(d){return ["日","一","二","三","四","五","六"][d.getDay()]}

/* ---------- 计时器 ---------- */
function setMode(m){
  if(running)return;   /* 运行中禁切模式 */
  mode=m;
  document.querySelectorAll(".mode-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("timerPanel").className="timer-panel "+(m==="focus"?"":m);
  leftMs=MODES[m].min*60000;
  updateRing();
}
function toggleTimer(){
  running?pauseTimer():startTimer();
}
function startTimer(){
  running=true;
  endTime=Date.now()+leftMs;
  $("startBtn").textContent="⏸ 暂停";
  timerIv=setInterval(tick,250);
  tick();
}
function pauseTimer(){
  running=false;
  leftMs=Math.max(0,endTime-Date.now());
  clearInterval(timerIv);
  $("startBtn").textContent="▶ 继续";
}
function resetTimer(){
  running=false;
  clearInterval(timerIv);
  leftMs=MODES[mode].min*60000;
  $("startBtn").textContent=mode==="focus"?"▶ 开始专注":"▶ 开始休息";
  updateRing();
}
function tick(){
  leftMs=Math.max(0,endTime-Date.now());
  updateRing();
  if(leftMs<=0)finishPhase();
}
function updateRing(){
  const total=MODES[mode].min*60000;
  const pct=leftMs/total;
  $("ringFg").style.strokeDashoffset=(C*(1-pct)).toFixed(1);
  const s=Math.ceil(leftMs/1000);
  $("timeNum").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  $("modeLabel").textContent=MODES[mode].label;
}
function finishPhase(){
  running=false;
  clearInterval(timerIv);
  const wasFocus=mode==="focus";
  if(wasFocus){
    focusCount++;
    recordFocus();
    /* 任务计数 */
    if(curTaskId){
      const t=tasks.find(x=>x.id===curTaskId);
      if(t)t.count++;
    }
    /* 长休判定：每4个 */
    setMode(focusCount%4===0?"long":"short");
    notify("🍅 番茄完成！"+(focusCount%4===0?"休息15分钟":"休息5分钟"));
  }else{
    setMode("focus");
    notify("☕ 休息结束，开始新番茄！");
  }
  save();renderTasks();renderStats();renderChart();
  $("startBtn").textContent="▶ 开始";
}
function recordFocus(){
  const d=todayStr();
  let h=history.find(x=>x.date===d);
  if(!h){h={date:d,minutes:0,pomos:0};history.push(h)}
  h.minutes+=MODES.focus.min;
  h.pomos+=1;
}
function notify(msg){
  if(navigator.vibrate)navigator.vibrate(200);
  /* 简单 toast */
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:12px 24px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4)";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

/* ---------- 任务 ---------- */
function addTask(){
  const n=$("taskInp").value.trim();
  if(!n)return;
  tasks.push({id:Date.now(),name:n,count:0});
  $("taskInp").value="";
  save();renderTasks();
}
function pickTask(id){
  curTaskId=curTaskId===id?null:id;
  renderTasks();
}
function delTask(id,btn){
  if(!btn.classList.contains("armed")){
    btn.classList.add("armed");btn.textContent="确认?";
    setTimeout(()=>{btn.classList.remove("armed");btn.textContent="✕"},2500);
    return;
  }
  tasks=tasks.filter(t=>t.id!==id);
  if(curTaskId===id)curTaskId=null;
  save();renderTasks();
}
function renderTasks(){
  $("taskList").innerHTML=tasks.length?tasks.map(t=>`
    <div class="task ${curTaskId===t.id?"cur":""}" onclick="pickTask(${t.id})">
      <div class="radio"></div>
      <div class="nm">${esc(t.name)}</div>
      ${t.count?`<span class="cnt">🍅×${t.count}</span>`:""}
      <button class="del" onclick="event.stopPropagation();delTask(${t.id},this)">✕</button>
    </div>`).join(""):`<div class="empty">暂无任务，上方添加</div>`;
  const cur=tasks.find(t=>t.id===curTaskId);
  $("taskHint").innerHTML=cur?`🎯 正在为 <b>${esc(cur.name)}</b> 专注`:tasks.length?"👆 点选任务关联番茄钟":"先添加任务，或直接裸刷番茄 🍅";
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}

/* ---------- 统计与图表 ---------- */
function renderStats(){
  const d=todayStr();
  const h=history.find(x=>x.date===d);
  $("pomoToday").textContent=h?h.pomos:0;
  $("minToday").textContent=h?h.minutes:0;
}
function renderChart(){
  /* 近7天 */
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);
    const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    days.push({ds,d,today:i===0});
  }
  const vals=days.map(({ds})=>history.find(h=>h.date===ds)?.minutes||0);
  const max=Math.max(60,...vals);   /* 至少60分钟刻度 */
  const today=new Date();
  const mon=new Date(today);mon.setDate(today.getDate()-6);
  $("weekRange").textContent=`${mon.getMonth()+1}/${mon.getDate()} - ${today.getMonth()+1}/${today.getDate()}`;
  $("chart").innerHTML=days.map((d,i)=>`
    <div class="bar-col">
      <div class="bar ${d.today?"today":""}" style="height:${Math.max(3,vals[i]/max*100)}%">
        ${vals[i]?`<span class="val">${vals[i]}</span>`:""}
      </div>
      <div class="bar-label ${d.today?"today":""}">${d.today?"今天":dayCN(d.d)}</div>
    </div>`).join("");
  const total=vals.reduce((a,b)=>a+b,0);
  const pomos=days.reduce((a,{ds})=>a+(history.find(h=>h.date===ds)?.pomos||0),0);
  $("weekTotal").textContent=total;
  $("weekPomos").textContent=pomos;
}

/* ---------- 启动 ---------- */
load();
renderTasks();
renderStats();
renderChart();
updateRing();
/* 页面恢复时校准（防切后台后回来看时间跳变） */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&running)tick();
});
</script>
</body>
</html>
