<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 习惯打卡 · Habit Tracker</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6; --purple:#c586c0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-anchor:none}
body{background:radial-gradient(ellipse at 50% 0%,#1e2230 0%,var(--bg) 60%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:920px;margin:0 auto}
header{margin-bottom:16px}
h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}

/* 添加习惯 */
.add-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.add-row input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:13px;padding:10px 14px;border-radius:11px;outline:none;-webkit-user-select:text;user-select:text}
.add-row input:focus{border-color:var(--gold)}
.add-btn{background:var(--gold);border:none;color:#1a1a22;font-size:13px;font-weight:700;padding:10px 22px;border-radius:11px;cursor:pointer;outline:none}
.add-btn:active{filter:brightness(1.2)}

/* 习惯卡片 */
.habits{display:flex;flex-direction:column;gap:14px}
.habit{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.h-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.h-name .ico{font-size:20px}
.h-stats{display:flex;gap:14px;font-size:11px;color:var(--muted)}
.h-stats b{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}
.h-stats .st{display:flex;flex-direction:column;align-items:center;gap:1px}
.h-ops{display:flex;gap:6px}
/* 右上角悬浮删除按钮（桌面/移动端同位置） */
.h-del{position:absolute;top:12px;right:12px;z-index:5;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--dim);font-size:12px;width:28px;height:28px;border-radius:8px;cursor:pointer;outline:none;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.h-del:hover{color:var(--red);border-color:var(--red)}}
.h-del.armed{color:var(--red);border-color:var(--red);width:auto;padding:0 10px;font-size:11px}
.h-op{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:11px;padding:5px 12px;border-radius:8px;cursor:pointer;outline:none}
@media(hover:hover){.h-op:hover{color:var(--gold);border-color:var(--gold)}}
.h-op.del.armed{color:var(--red);border-color:var(--red)}

/* 今日打卡按钮 */
.today-btn{width:100%;background:var(--panel2);border:1px dashed var(--line);color:var(--muted);font-size:13px;padding:10px;border-radius:10px;cursor:pointer;outline:none;margin-bottom:14px;transition:.15s}
@media(hover:hover){.today-btn:hover{border-color:var(--green);color:var(--green)}}
.today-btn.done{background:rgba(78,201,176,.12);border-style:solid;border-color:var(--green);color:var(--green);font-weight:700}

/* 热力图 */
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:flex;gap:3px;min-width:fit-content}
.week-col{display:flex;flex-direction:column;gap:3px}
.cell{width:13px;height:13px;border-radius:3px;background:var(--panel2);cursor:pointer}
@media(hover:hover){.cell:hover{outline:1px solid var(--gold)}}
.cell.l1{background:rgba(78,201,176,.35)}
.cell.l2{background:rgba(78,201,176,.6)}
.cell.l3{background:rgba(78,201,176,.85)}
.cell.l4{background:#4ec9b0;box-shadow:0 0 5px rgba(78,201,176,.5)}
.cell.today-c{outline:1.5px solid var(--gold)}
.heat-legend{display:flex;gap:5px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:10px;color:var(--dim)}
.heat-legend .cell{cursor:default;width:11px;height:11px}

/* 月份标签 */
.months span{font-size:9px;color:var(--dim);white-space:nowrap}
.month-gap{width:10px}

.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--dim)}
.empty .big{font-size:40px;margin-bottom:10px}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}

@media(max-width:560px){
  .h-top{flex-direction:column;align-items:flex-start}
  .h-stats{width:100%;justify-content:space-between}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>习惯打卡日历</h1>
    <div class="sub">GitHub 热力图风格 · 连续天数 · 365 天记录</div>
  </header>

  <div class="add-row">
    <input type="text" id="hInp" placeholder="新习惯名称，如：晨跑 / 阅读 30 分钟 / 喝 8 杯水" maxlength="20" onkeydown="if(event.key==='Enter')addHabit()">
    <button class="add-btn" onclick="addHabit()">＋ 添加习惯</button>
  </div>

  <div class="habits" id="habits"></div>

  <footer>100 Apps Challenge · App #027 · <b>热力图数据结构</b>：days{ 'YYYY-MM-DD': 1 }<br>五级色阶映射 · 连续天数（streak）正逆向扫描 · localStorage 持久化</footer>
</div>

<script>
/* ============================================================
   新知识点：GitHub 风格热力图
   - 数据模型：habit = {id, name, ico, days:{"2026-08-27":1}}
     用对象键值对存日期（O(1) 查询，比数组 includes 快）
   - 热力图渲染：52 周 × 7 天列式布局
     列=周（左旧右新），行=周一到周日
     色阶：无记录灰 / 1级浅绿 → 4级饱和绿
   - streak 连续天数：从今天往前逐日探测 days 键存在
   - 月份标签：每列首日所在月变化时插入标签
   ============================================================ */
const $=id=>document.getElementById(id);
const KEY="habits_v1";
let habits=[];

try{habits=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(habits))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const ICOS=["🔥","📚","🏃","💧","🧘","💪","🌱","✍️","🎧","🥗","😴","🎯"];
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayStr(){return dstr(new Date())}

/* ---------- 添加/删除 ---------- */
function addHabit(){
  const name=$("hInp").value.trim();
  if(!name){toast("先写习惯名称 💪");return}
  if(habits.some(h=>h.name===name)){toast("已经有「"+name+"」啦");return}
  const ico=ICOS[habits.length%ICOS.length];
  habits.push({id:Date.now(),name,ico,days:{}});
  $("hInp").value="";
  save();render();
  toast("新习惯已创建 "+ico);
}
let delArmed=0,delTimer=null;
function delHabit(id,btn){
  if(delArmed!==id){
    delArmed=id;
    if(btn){btn.classList.add("armed");btn.textContent="确认删除?"}
    clearTimeout(delTimer);
    delTimer=setTimeout(()=>{delArmed=0;if(btn){btn.classList.remove("armed");btn.textContent="删除"}},2500);
    return;
  }
  clearTimeout(delTimer);delArmed=0;
  habits=habits.filter(h=>h.id!==id);
  save();render();
  toast("已删除");
}

/* ---------- 打卡 ---------- */
function toggle(hid,dateStr){
  const h=habits.find(x=>x.id===hid);
  if(!h)return;
  if(h.days[dateStr])delete h.days[dateStr];
  else h.days[dateStr]=1;
  save();render();
}
function today(hid){toggle(hid,todayStr())}

/* ---------- 统计 ---------- */
function streak(h){
  /* 从今天往前数连续天数（今天没打则从昨天起算——streak 不因"今天还没打"清零） */
  const d=new Date();
  if(!h.days[dstr(d)])d.setDate(d.getDate()-1);
  let n=0;
  while(h.days[dstr(d)]){
    n++;d.setDate(d.getDate()-1);
  }
  return n;
}
function totalDays(h){return Object.keys(h.days).length}

/* ---------- 渲染 ---------- */
function render(){
  if(!habits.length){
    $("habits").innerHTML=`<div class="empty"><div class="big">📅</div>添加第一个习惯，开始你的坚持之旅</div>`;
    return;
  }
  const todayIs=dstr(new Date());
  $("habits").innerHTML=habits.map(h=>{
    const doneToday=!!h.days[todayIs];
    const sk=streak(h),tot=totalDays(h);
    return `<div class="habit" style="position:relative">
      <button class="h-del" onclick="delHabit(${h.id},this)" title="删除习惯">✕</button>
      <div class="h-top">
        <div class="h-name"><span class="ico">${h.ico}</span>${esc(h.name)}</div>
        <div class="h-stats">
          <div class="st"><b>${sk}</b>连续天数</div>
          <div class="st"><b>${tot}</b>累计打卡</div>
          <div class="st"><b>${Math.min(100,Math.round(tot/365*100))}%</b>全年完成</div>
        </div>
      </div>
      <button class="today-btn ${doneToday?"done":""}" onclick="today(${h.id})">
        ${doneToday?"✅ 今日已打卡（点击撤销）":"○ 今天打卡"}
      </button>
      ${heatHTML(h)}
    </div>`;
  }).join("");
}

/* 热力图：近 26 周（半年）列式布局 */
function heatHTML(h){
  /* 53 周 = 完整 365 天 / 12 个月热力图（GitHub 全年样式） */
  const W=53;
  const CELL=13,GAP=3,STEP=CELL+GAP;   /* 16px/列 */
  const today=new Date();
  /* 本周日为终点，往前推 53 周 */
  const end=new Date(today);
  end.setDate(today.getDate()+(7-today.getDay()));
  const start=new Date(end);
  start.setDate(end.getDate()-W*7+1);
  const todayIs=dstr(today);
  let cols="",monthTags="";
  let lastMonth=-1;
  for(let w=0;w<W;w++){
    let cells="";
    for(let dd=0;dd<7;dd++){
      const cur=new Date(start);
      cur.setDate(start.getDate()+w*7+dd);
      if(cur>today){
        /* 未来格子：透明占位 */
        cells+=`<div class="cell" style="background:transparent;cursor:default"></div>`;
        continue;
      }
      const ds=dstr(cur);
      const has=!!h.days[ds];
      const lv=has?4:0;
      cells+=`<div class="cell ${lv?"l"+lv:""} ${ds===todayIs?"today-c":""}" onclick="toggle(${h.id},'${ds}')" title="${ds}${has?" ✓":" 点击补卡"}"></div>`;
    }
    /* 月份标签：每月第一列出现时标注（绝对偏移定位，53 列跨度精确） */
    const wkStart=new Date(start);
    wkStart.setDate(start.getDate()+w*7);
    if(wkStart.getMonth()!==lastMonth){
      monthTags+=`<span style="position:absolute;left:${w*STEP}px">${wkStart.getMonth()+1}月</span>`;
      lastMonth=wkStart.getMonth();
    }
    cols+=`<div class="week-col">${cells}</div>`;
  }
  return `<div class="heat-wrap">
    <div class="months" style="position:relative;height:14px;margin-bottom:5px;min-width:fit-content">${monthTags}</div>
    <div class="heat">${cols}</div>
    <div class="heat-legend">少 <div class="cell"></div><div class="cell l1"></div><div class="cell l2"></div><div class="cell l3"></div><div class="cell l4"></div> 多 · 共 ${W} 周 / 12 个月</div>
  </div>`;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  let t=document.getElementById("toastBox");
  if(!t){
    t=document.createElement("div");
    t.id="toastBox";
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 22px;border-radius:11px;font-size:13px;z-index:99";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.remove(),1800);
}

render();
</script>
</body>
</html>
