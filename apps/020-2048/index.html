<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 2048 · 数字合并</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6;
  /* 2048 经典配色（深色主题适配） */
  --t0:#2a2e3b; --t2:#3a3f52; --t4:#4a4f62; --t8:#d19a66; --t16:#e5a663;
  --t32:#e5854f; --t64:#e06c75; --t128:#d1b65f; --t256:#e5c547;
  --t512:#e5d027; --t1024:#c5d627; --t2048:#4ec9b0; --t4096:#569cd6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 20%,#1e2230 0%,var(--bg) 65%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.app{width:100%;max-width:460px;text-align:center}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.title h1{font-size:32px;font-weight:800;color:var(--gold);letter-spacing:2px;line-height:1}
.title .sub{color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:1px}
.hud{display:flex;gap:8px}
.score-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:78px;text-align:center}
.score-box .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}
.score-box .v.best{color:var(--green)}
.score-box .k{font-size:9px;color:var(--dim);letter-spacing:2px;margin-top:1px}

.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.bar .intro{color:var(--muted);font-size:11px;line-height:1.6;flex:1}
.btn{background:var(--gold);border:none;color:#1a1a22;font-size:13px;font-weight:700;padding:8px 18px;border-radius:9px;cursor:pointer;outline:none;transition:.15s;flex-shrink:0}
.btn:hover{filter:brightness(1.1)}

/* 棋盘 */
.board-wrap{position:relative;margin:0 auto;touch-action:none}
.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;aspect-ratio:1/1;position:relative;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.cell{background:var(--t0);border-radius:8px;display:flex;align-items:center;justify-content:center}
/* 数字格 */
.tile{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;transition:transform .12s ease-out;will-change:transform}
.tile[data-v="2"]{background:var(--t2);color:var(--text)}
.tile[data-v="4"]{background:var(--t4);color:var(--text)}
.tile[data-v="8"]{background:var(--t8);color:#1a1a22}
.tile[data-v="16"]{background:var(--t16);color:#1a1a22}
.tile[data-v="32"]{background:var(--t32);color:#fff}
.tile[data-v="64"]{background:var(--t64);color:#fff}
.tile[data-v="128"]{background:var(--t128);color:#1a1a22;font-size:90%}
.tile[data-v="256"]{background:var(--t256);color:#1a1a22;font-size:90%}
.tile[data-v="512"]{background:var(--t512);color:#1a1a22;font-size:90%}
.tile[data-v="1024"]{background:var(--t1024);color:#1a1a22;font-size:75%}
.tile[data-v="2048"]{background:var(--t2048);color:#1a1a22;font-size:75%;box-shadow:0 0 18px rgba(78,201,176,.6)}
.tile[data-v="4096"]{background:var(--t4096);color:#1a1a22;font-size:70%;box-shadow:0 0 22px rgba(86,156,214,.7)}
.tile[data-v="8192"]{background:#9a6b1f;color:#1a1a22;font-size:65%;box-shadow:0 0 26px rgba(229,181,103,.8)}
.tile.new{animation:pop .18s ease-out}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.tile.merged{animation:merge .18s ease-out}
@keyframes merge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* 覆盖层 */
.overlay{position:absolute;inset:0;background:rgba(10,11,16,.88);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s;z-index:10;backdrop-filter:blur(4px)}
.overlay.show{opacity:1;pointer-events:auto}
.overlay .big{font-size:28px;font-weight:800;letter-spacing:2px;margin-bottom:8px}
.overlay .big.win{color:var(--green);text-shadow:0 0 24px rgba(78,201,176,.4)}
.overlay .big.lose{color:var(--red)}
.overlay .sm{color:var(--muted);font-size:13px;margin-bottom:14px}
.overlay .sm b{color:var(--text)}

/* 移动端 D-pad */
.dpad{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:5px;margin:14px auto 0;width:fit-content}
.dpad button{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:20px;border-radius:12px;cursor:pointer;outline:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:.1s}
.dpad button:active{background:var(--gold);color:#1a1a22;transform:scale(.92)}
.dpad .up{grid-column:2;grid-row:1}
.dpad .left{grid-column:1;grid-row:2}
.dpad .right{grid-column:3;grid-row:2}
.dpad .down{grid-column:2;grid-row:3}

.keys{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.key{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--muted)}
.key b{color:var(--gold)}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:18px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}

@media(max-width:600px){
  .dpad{display:grid}
  .keys{display:none}
  .title h1{font-size:26px}
  .score-box{min-width:62px;padding:6px 10px}
  .score-box .v{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <h1>2048</h1>
      <div class="sub">合并相同数字 · 达到 2048 获胜</div>
    </div>
    <div class="hud">
      <div class="score-box"><div class="v" id="score">0</div><div class="k">SCORE</div></div>
      <div class="score-box"><div class="v best" id="best">0</div><div class="k">BEST</div></div>
    </div>
  </header>

  <div class="bar">
    <div class="intro">用 <b style="color:var(--gold)">方向键</b> 移动方块，相同数字相撞合并。</div>
    <button class="btn" onclick="newGame()">↻ 新局</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="ov">
      <div class="big" id="ovBig"></div>
      <div class="sm" id="ovSm"></div>
      <button class="btn" onclick="newGame()">↻ 再来一局</button>
    </div>
  </div>

  <div class="keys">
    <span class="key"><b>↑↓←→</b> / WASD</span>
    <span class="key"><b>R</b> 新局</span>
    <span class="key"><b>触屏滑动</b> 移动</span>
  </div>

  <div class="dpad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <button class="right" data-d="right">▶</button>
    <button class="down" data-d="down">▼</button>
  </div>

  <footer>100 Apps Challenge · App #020 · <b>矩阵旋转算法</b>：四方向归一为左移 + 矩阵转置<br>合并规则：相邻相同 → 数值×2，每次移动后随机生成 2 或 4</footer>
</div>

<script>
/* ============================================================
   新知识点：矩阵旋转算法（2048 的精髓）
   - 四方向移动归一为"左移"：上/下/右 移动前先转置/翻转矩阵
     左移 = 原矩阵        右移 = 每行翻转 → 左移 → 翻转
     上移 = 转置 → 左移 → 转置  下移 = 转置 → 翻转 → 左移 → 翻转 → 转置
   - 这样只写一个 slideLeftRow() 函数就通吃四方向
   - 合并规则：相邻相同且非零 → 相加；每行每格只能合并一次（防止 4 连续合并成 8）
   - 动画用 transform 平移格点位置，merge 用 scale 弹一下
   ============================================================ */
const $=id=>document.getElementById(id);
const N=4;
let grid=[],score=0,best=0,over=false,won=false;
try{best=+localStorage.getItem("2048_best")||0}catch(e){}
$("best").textContent=best;

/* 初始化棋盘背景格 */
function buildBoardBg(){
  let h="";
  for(let i=0;i<N*N;i++)h+=`<div class="cell"></div>`;
  $("board").innerHTML=h;
}

/* 数字格尺寸（动态算：响应式） */
let cellSize=0,gap=8;
function calcSize(){
  const w=$("board").clientWidth;
  cellSize=(w-gap*(N+1))/N;
}
addEventListener("resize",()=>{calcSize();renderTiles()});

function newGame(){
  grid=Array.from({length:N},()=>Array(N).fill(0));
  score=0;over=false;won=false;
  addRandom();addRandom();
  $("ov").classList.remove("show");
  calcSize();
  updateHud();
  renderTiles();
}

/* 随机生成 2 或 4（90% 是 2，10% 是 4） */
function addRandom(){
  const empty=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]===0)empty.push([r,c]);
  if(!empty.length)return false;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
  return true;
}

/* ---------- 单行左移（合并） ---------- */
function slideLeft(row){
  const filtered=row.filter(x=>x!==0);
  const merged=[];
  let gained=0;
  for(let i=0;i<filtered.length;i++){
    if(i+1<filtered.length&&filtered[i]===filtered[i+1]){
      merged.push(filtered[i]*2);
      gained+=filtered[i]*2;
      if(filtered[i]*2===2048)won=true;
      i++;   /* 跳过已合并的下一个 */
    }else{
      merged.push(filtered[i]);
    }
  }
  while(merged.length<N)merged.push(0);
  return{row:merged,gained};
}

/* ---------- 四方向移动（矩阵旋转归一） ---------- */
function move(dir){
  if(over)return;
  const before=grid.map(r=>[...r]);
  let gained=0;
  if(dir==="left"){
    for(let r=0;r<N;r++){
      const res=slideLeft(grid[r]);
      grid[r]=res.row;gained+=res.gained;
    }
  }else if(dir==="right"){
    for(let r=0;r<N;r++){
      const reversed=grid[r].slice().reverse();
      const res=slideLeft(reversed);
      grid[r]=res.row.reverse();gained+=res.gained;
    }
  }else if(dir==="up"){
    /* 转置 → 每行左移 → 转置回来 */
    const trans=transpose(grid);
    for(let r=0;r<N;r++){
      const res=slideLeft(trans[r]);
      trans[r]=res.row;gained+=res.gained;
    }
    grid=transpose(trans);
  }else if(dir==="down"){
    const trans=transpose(grid);
    for(let r=0;r<N;r++){
      const reversed=trans[r].slice().reverse();
      const res=slideLeft(reversed);
      trans[r]=res.row.reverse();gained+=res.gained;
    }
    grid=transpose(trans);
  }
  /* 检测是否变化 */
  const changed=JSON.stringify(before)!==JSON.stringify(grid);
  if(changed){
    score+=gained;
    if(score>best){best=score;try{localStorage.setItem("2048_best",best)}catch(e){}}
    addRandom();
    updateHud();
    renderTiles(true);   /* 动画 */
    if(won)showOv("🎉 你赢了！","达到 2048！得分 <b>"+score+"</b><br>可继续挑战更高分","win");
    else if(!canMove())showOv("💀 Game Over","无路可走 · 得分 <b>"+score+"</b>","lose"),over=true;
  }
}

function transpose(m){return m[0].map((_,c)=>m.map(r=>r[c]))}

function canMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(grid[r][c]===0)return true;
    if(c+1<N&&grid[r][c]===grid[r][c+1])return true;
    if(r+1<N&&grid[r][c]===grid[r+1][c])return true;
  }
  return false;
}

/* ---------- 渲染 ---------- */
function renderTiles(animate){
  const board=$("board");
  /* 移除旧 tile，保留背景格 */
  [...board.querySelectorAll(".tile")].forEach(t=>t.remove());
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=grid[r][c];
    if(!v)continue;
    const t=document.createElement("div");
    t.className="tile"+(animate?" new":"");
    t.dataset.v=v;
    t.textContent=v;
    t.style.width=cellSize+"px";
    t.style.height=cellSize+"px";
    t.style.fontSize=Math.max(14,cellSize*(v>=1024?0.32:v>=128?0.4:0.5))+"px";
    t.style.left=(8+c*(cellSize+gap))+"px";
    t.style.top=(8+r*(cellSize+gap))+"px";
    board.appendChild(t);
  }
}

function updateHud(){
  $("score").textContent=score;
  $("best").textContent=best;
}

function showOv(big,sm,cls){
  $("ovBig").textContent=big;$("ovBig").className="big "+cls;
  $("ovSm").innerHTML=sm;
  $("ov").classList.add("show");
}

/* ---------- 输入 ---------- */
const KEYMAP={
  ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
  w:"up",s:"down",a:"left",d:"right",
  W:"up",S:"down",A:"left",D:"right",
};
addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R"){newGame();return}
  const d=KEYMAP[e.key];
  if(d){e.preventDefault();move(d)}
});
/* 移动端 D-pad */
document.querySelectorAll(".dpad button").forEach(b=>{
  const h=e=>{e.preventDefault();move(b.dataset.d)};
  b.addEventListener("touchstart",h,{passive:false});
  b.addEventListener("click",h);
});
/* 画布滑动 */
let ts=null;
const bw=$("board").parentNode;
bw.addEventListener("touchstart",e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault()},{passive:false});
bw.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
bw.addEventListener("touchend",e=>{
  if(!ts)return;
  const t=e.changedTouches[0],dx=t.clientX-ts.x,dy=t.clientY-ts.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<25){ts=null;return}
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?"right":"left");
  else move(dy>0?"down":"up");
  ts=null;
},{passive:false});

/* 启动 */
buildBoardBg();
newGame();
</script>
</body>
</html>
