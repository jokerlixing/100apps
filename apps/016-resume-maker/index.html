<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 Markdown简历生成器 · Resume Maker</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 20%,#1e2230 0%,var(--bg) 65%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:1180px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--gold);border:none;color:#1a1a22;font-size:13px;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer;transition:.15s;outline:none}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-weight:400;font-size:12px;padding:8px 14px}
.btn.ghost:hover{color:var(--gold);border-color:var(--gold)}

/* 双栏布局 */
.cols{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}

/* 表单区 */
.form-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.fg label{display:block;font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:6px}
.fg input,.fg textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13px;padding:9px 12px;border-radius:9px;outline:none;transition:.15s;font-family:inherit;-webkit-user-select:text;user-select:text}
.fg input:focus,.fg textarea:focus{border-color:var(--gold)}
.fg textarea{min-height:130px;resize:vertical;line-height:1.7;font-family:Consolas,"Courier New",monospace;font-size:12.5px}
.fg .hint{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.6}
.fg .hint code{color:var(--gold);background:rgba(229,181,103,.1);padding:1px 5px;border-radius:4px;font-size:10px}

/* 预览区（纸张） */
.paper-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:600px}
.paper{background:#fdfdfb;color:#2a2a2e;padding:48px 52px;border-radius:6px;font-size:14px;line-height:1.85;box-shadow:0 4px 30px rgba(0,0,0,.4);min-height:760px;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
/* 简历排版样式 */
.paper h1{color:#1a1a20;font-size:26px;letter-spacing:2px;text-align:center;margin-bottom:4px;font-weight:800}
.paper .contact{text-align:center;color:#666;font-size:12px;margin-bottom:6px;line-height:1.9}
.paper .contact span{margin:0 10px}
.paper h2{font-size:15px;color:#1a1a20;border-left:4px solid var(--gold);padding-left:10px;margin:22px 0 10px;letter-spacing:2px;font-weight:700}
.paper h3{font-size:13.5px;color:#2a2a2e;margin:10px 0 4px;font-weight:700}
.paper p{margin:6px 0;color:#3d3d42}
.paper ul{margin:6px 0 6px 4px;list-style:none}
.paper li{padding-left:16px;position:relative;color:#3d3d42;margin:4px 0}
.paper li::before{content:"•";position:absolute;left:4px;color:var(--gold)}
.paper strong{color:#1a1a20;font-weight:700}
.paper em{color:#555}
.paper code{background:#f0ede4;padding:1px 6px;border-radius:4px;font-size:12px;color:#8a5a2b;font-family:Consolas,monospace}
.paper hr{border:none;border-top:1px solid #e5e2d8;margin:16px 0}
.paper a{color:#2f6db3;text-decoration:none}
.paper .placeholder{color:#bbb;text-align:center;padding:120px 0;font-size:14px}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}

/* 打印样式：只打纸张 */
@media print{
  body{background:#fff;padding:0}
  .app>header,.form-panel,.paper-wrap,footer,.toolbar{display:none!important}
  .paper{box-shadow:none;min-height:auto;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Markdown 简历生成器</h1>
      <div class="sub">表单填写 · 实时预览 · 导出打印/下载</div>
    </div>
    <div class="toolbar">
      <button class="btn ghost" onclick="fillDemo()">✨ 示例数据</button>
      <button class="btn ghost" onclick="clearAll()">🗑 清空</button>
      <button class="btn ghost" onclick="downloadMD()">⬇ 下载 .md</button>
      <button class="btn" onclick="window.print()">🖨 打印/导出 PDF</button>
    </div>
  </header>

  <div class="cols">
    <div class="form-panel">
      <div class="fg">
        <label>姓名</label>
        <input type="text" id="fName" placeholder="张三" maxlength="20" oninput="render()">
      </div>
      <div class="fg">
        <label>求职意向</label>
        <input type="text" id="fJob" placeholder="前端开发工程师" maxlength="30" oninput="render()">
      </div>
      <div class="fg">
        <label>联系方式</label>
        <input type="text" id="fContact" placeholder="138-0000-0000 ｜ zhangsan@mail.com ｜ 深圳" maxlength="80" oninput="render()">
      </div>
      <div class="fg">
        <label>个人简介</label>
        <textarea id="fSummary" placeholder="3 年前端经验，熟悉 Vue/React..." oninput="render()"></textarea>
      </div>
      <div class="fg">
        <label>技能清单</label>
        <textarea id="fSkills" placeholder="每行一项技能" oninput="render()"></textarea>
        <div class="hint">每行一项，会渲染成要点列表</div>
      </div>
      <div class="fg">
        <label>工作经历 <span style="color:var(--dim)">（支持 Markdown）</span></label>
        <textarea id="fWork" style="min-height:170px" oninput="render()"></textarea>
        <div class="hint">
          语法：<code>## 大标题</code> <code>### 小节</code> <code>- 列表项</code> <code>**加粗**</code> <code>*斜体*</code> <code>---</code> 分隔线
        </div>
      </div>
      <div class="fg">
        <label>项目经历 / 教育 <span style="color:var(--dim)">（同样支持 Markdown）</span></label>
        <textarea id="fEdu" oninput="render()"></textarea>
      </div>
    </div>

    <div class="paper-wrap">
      <div class="paper" id="paper"></div>
    </div>
  </div>

  <footer>100 Apps Challenge · App #016 · <b>迷你 Markdown 解析器</b>：标题/列表/加粗/斜体/代码/分隔线<br>数据自动存 localStorage · 打印时只输出纸张部分</footer>
</div>

<script>
/* ============================================================
   新知识点：迷你 Markdown 解析器（免依赖的正则分型解析）
   - 逐行扫描 + 正则匹配行型（标题/列表/分隔线/空行）
   - 行内再处理加粗/斜体/代码（顺序：code 先行防内部污染）
   - 转义 HTML 防注入（简历内容当纯文本处理）
   - 输出受控 HTML 白名单标签——这是所有 md 渲染器的核心思路
   ============================================================ */
const KEY="resume_v1";
const $=id=>document.getElementById(id);
const FIELDS=["fName","fJob","fContact","fSummary","fSkills","fWork","fEdu"];

/* ---------- 迷你 Markdown → HTML ---------- */
function esc(s){return s.replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}
function inline(s){
  /* 行内元素：先转义 → 代码 → 粗体 → 斜体 */
  let t=esc(s);
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  return t;
}
function md2html(src){
  const lines=src.split("\n");
  let html="",inList=false;
  const closeList=()=>{if(inList){html+="</ul>";inList=false}};
  for(const raw of lines){
    const line=raw.trimEnd();
    if(/^##\s+/.test(line)){closeList();html+=`<h2>${inline(line.slice(3))}</h2>`}
    else if(/^###\s+/.test(line)){closeList();html+=`<h3>${inline(line.slice(4))}</h3>`}
    else if(/^[-*]\s+/.test(line)){
      if(!inList){html+="<ul>";inList=true}
      html+=`<li>${inline(line.slice(2))}</li>`;
    }
    else if(/^---+$/.test(line)){closeList();html+="<hr>"}
    else if(line===""){closeList()}
    else{closeList();html+=`<p>${inline(line)}</p>`}
  }
  closeList();
  return html;
}
/* 多行纯文本 → 列表（技能栏用） */
function lines2ul(src){
  const items=src.split("\n").map(s=>s.trim()).filter(Boolean);
  return items.length?`<ul>${items.map(i=>`<li>${inline(i)}</li>`).join("")}</ul>`:"";
}

/* ---------- 渲染 ---------- */
function render(){
  const name=$("fName").value.trim();
  const job=$("fJob").value.trim();
  const contact=$("fContact").value.trim();
  const summary=$("fSummary").value.trim();
  const skills=$("fSkills").value;
  const work=$("fWork").value;
  const edu=$("fEdu").value;

  if(!name&&!job&&!contact&&!summary&&!skills.trim()&&!work.trim()&&!edu.trim()){
    $("paper").innerHTML=`<div class="placeholder">左侧填写内容，这里实时生成简历 📄<br>点击上方「示例数据」快速体验</div>`;
    return;
  }

  let h="";
  if(name)h+=`<h1>${esc(name)}</h1>`;
  if(job)h+=`<p style="text-align:center;color:#8a6d1f;font-size:13px;margin-bottom:2px">求职意向 · ${esc(job)}</p>`;
  if(contact){
    /* 用 ｜ 或 | 分隔的联系方式 */
    const parts=contact.split(/[｜|]/).map(s=>s.trim()).filter(Boolean);
    h+=`<div class="contact">${parts.map(p=>`<span>${esc(p)}</span>`).join("·")}</div>`;
  }
  if(name||job||contact)h+=`<hr>`;
  if(summary)h+=`<h2>个人简介</h2>${md2html(summary)}`;
  if(skills.trim())h+=`<h2>专业技能</h2>${lines2ul(skills)}`;
  if(work.trim())h+=`<h2>工作经历</h2>${md2html(work)}`;
  if(edu.trim())h+=`<h2>项目与教育</h2>${md2html(edu)}`;
  $("paper").innerHTML=h;
}

/* ---------- 持久化 ---------- */
function save(){
  const data={};
  FIELDS.forEach(f=>data[f]=$(f).value);
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s)FIELDS.forEach(f=>{if(s[f]!==undefined)$(f).value=s[f]});
  }catch(e){}
}
/* 输入即存 */
FIELDS.forEach(f=>$(f).addEventListener("input",save));

/* ---------- 工具 ---------- */
function fillDemo(){
  $("fName").value="程序猿";
  $("fJob").value="前端开发工程师";
  $("fContact").value="138-0000-0000 ｜ xingxing@mail.com ｜ 深圳";
  $("fSummary").value="3 年前端开发经验，主导过 3 个从 0 到 1 的项目。对**交互动效**与*性能优化*有较深实践，坚持写`技术博客`沉淀知识。";
  $("fSkills").value="HTML5 / CSS3 / JavaScript（ES6+）\nVue 3 + Pinia + Vite 全家桶\nReact + TypeScript\nNode.js / Express\nGit 协作与 CI/CD\n性能优化（Lighthouse 90+）";
  $("fWork").value="### ABC 科技 · 前端开发工程师（2023.07 - 至今）\n- 负责核心 SaaS 控制台开发，**日活 5w+**\n- 首屏加载从 3.2s 优化到 **1.1s**\n- 搭建组件库，团队效率提升 40%\n\n### XYZ 互联网 · 前端实习（2022.10 - 2023.05）\n- 参与营销活动页开发，支撑 10+ 场大促\n- 编写 E2E 测试，覆盖率 75%";
  $("fEdu").value="## 项目\n### 100 Apps Challenge\n- 100 天完成 100 个 Web 应用，覆盖工具/游戏/AI\n- GitHub 获 500+ Star\n\n## 教育\n### 某大学 · 计算机科学与技术（2019 - 2023）\n- GPA 3.6/4.0，获校级奖学金两次";
  save();render();
}
let clrArmed=false,clrTimer=null;
function clearAll(){
  const b=event.target;
  if(!clrArmed){
    clrArmed=true;
    b.textContent="⚠️ 确认清空?";
    clearTimeout(clrTimer);
    clrTimer=setTimeout(()=>{clrArmed=false;b.textContent="🗑 清空"},3000);
    return;
  }
  clrArmed=false;clearTimeout(clrTimer);
  b.textContent="🗑 清空";
  FIELDS.forEach(f=>$(f).value="");
  save();render();
}
function downloadMD(){
  const md=buildMD();
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(($("fName").value.trim()||"简历")+".md");
  a.click();
  URL.revokeObjectURL(a.href);
}
function buildMD(){
  const name=$("fName").value.trim(),job=$("fJob").value.trim(),contact=$("fContact").value.trim();
  let md="";
  if(name)md+=`# ${name}\n\n`;
  if(job)md+=`**求职意向 · ${job}**\n\n`;
  if(contact)md+=`> ${contact}\n\n---\n\n`;
  if($("fSummary").value.trim())md+=`## 个人简介\n\n${$("fSummary").value.trim()}\n\n`;
  const skills=$("fSkills").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(skills.length)md+=`## 专业技能\n\n${skills.map(s=>"- "+s).join("\n")}\n\n`;
  if($("fWork").value.trim())md+=`## 工作经历\n\n${$("fWork").value.trim()}\n\n`;
  if($("fEdu").value.trim())md+=`## 项目与教育\n\n${$("fEdu").value.trim()}\n\n`;
  return md;
}

load();
render();
</script>
</body>
</html>
