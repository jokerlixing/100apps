<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 节日倒计时 · Festival Countdown</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6; --purple:#c586c0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 20%,#1e2230 0%,var(--bg) 65%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:760px;margin:0 auto}
header{text-align:center;margin-bottom:22px}
h1{font-size:22px;font-weight:700;letter-spacing:4px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:2px}

/* 主焦点卡 */
.hero{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero .emoji{font-size:56px;line-height:1;margin-bottom:8px}
.hero .name{font-size:20px;font-weight:700;margin-bottom:4px}
.hero .date{color:var(--muted);font-size:13px;margin-bottom:18px}
.hero .clock{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.hero .cell{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:12px 10px;min-width:74px}
.hero .num{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .unit{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:2px}
/* 四色数字：天=金(主) 时=蓝 分=绿 秒=紫 */
#cD{color:var(--gold);font-size:38px;text-shadow:0 0 16px rgba(229,181,103,.35)}
#cH{color:var(--blue);text-shadow:0 0 12px rgba(86,156,214,.3)}
#cM{color:var(--green);text-shadow:0 0 12px rgba(78,201,176,.3)}
#cS{color:var(--purple);text-shadow:0 0 12px rgba(197,134,192,.3)}
.hero .tip{color:var(--dim);font-size:12px}
/* 到期提醒：24点前10秒高亮闪烁 */
.hero.flash{animation:heroFlash .8s ease-in-out infinite}
@keyframes heroFlash{
  0%,100%{box-shadow:0 0 0 rgba(229,181,103,0);border-color:var(--line)}
  50%{box-shadow:0 0 38px 4px rgba(229,181,103,.8);border-color:var(--gold)}
}
.card.flash{animation:cardFlash .8s ease-in-out infinite}
@keyframes cardFlash{
  0%,100%{box-shadow:0 0 0 rgba(224,108,117,0);border-color:var(--line)}
  50%{box-shadow:0 0 24px 2px rgba(224,108,117,.75);border-color:var(--red)}
}

/* 立体长方体进度条 + 中央进度数字 */
/* 中央进度文字：横跨填充/未填充区域，白字+黑影保证双向可读 */

/* 网格卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;transition:.15s}@media(hover:hover){
.card:hover{border-color:var(--dim);transform:translateY(-2px)}}
.card .emoji{font-size:28px;margin-bottom:6px}
.card .name{font-size:14px;font-weight:600;margin-bottom:2px;padding-right:44px}
.card .date{font-size:11px;color:var(--dim);margin-bottom:10px}
.card .dd{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.card .dd small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.card .dd.soon{color:var(--red)}
.card .dd.far{color:var(--green)}
/* 删除按钮：常显（所有卡片都有，含预置） */
.card .del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--muted);font-size:11px;cursor:pointer;padding:3px 9px;border-radius:10px;opacity:.85;line-height:1.4}@media(hover:hover){
.card .del:hover{color:var(--red);border-color:var(--red);opacity:1}}
.card.today{border-color:var(--gold);box-shadow:0 0 18px rgba(229,181,103,.2)}

/* 添加节日 + 工具行 */
.add-card{display:flex;gap:8px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:14px;align-items:center}
.add-card input,.add-card select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:9px;font-size:13px;outline:none;-webkit-user-select:text;user-select:text}
.add-card input:focus,.add-card select:focus{border-color:var(--gold)}
.add-card input[type=text]{flex:1;min-width:0}
.add-card input[type=date]{color-scheme:dark}
.add-card .emoji-inp{width:52px;text-align:center;font-size:16px}
.btn{background:var(--gold);border:none;color:#1a1a22;font-size:13px;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;transition:.15s;outline:none;white-space:nowrap}@media(hover:hover){
.btn:hover{filter:brightness(1.1)}}
.tools{display:flex;gap:8px;justify-content:center;margin-top:14px}
.btn.ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-weight:400;font-size:12px;padding:7px 14px}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:22px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}

@media(max-width:520px){
  .hero .clock{gap:6px}
  .hero .cell{min-width:60px;padding:10px 6px}
  .hero .num{font-size:24px}
  #cD{font-size:28px}
  .add-card{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>节日倒计时</h1>
    <div class="sub">国内主要节日 · 实时 countdown · 全部可删可自定义</div>
  </header>

  <div class="hero" id="hero">
    <div class="emoji" id="hEmoji">🎉</div>
    <div class="name" id="hName">—</div>
    <div class="date" id="hDate">—</div>
    <div class="clock">
      <div class="cell"><div class="num" id="cD">0</div><div class="unit">天</div></div>
      <div class="cell"><div class="num" id="cH">0</div><div class="unit">时</div></div>
      <div class="cell"><div class="num" id="cM">0</div><div class="unit">分</div></div>
      <div class="cell"><div class="num" id="cS">0</div><div class="unit">秒</div></div>
    </div>
    <div class="tip" id="hTip" style="margin-top:10px"></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="add-card">
    <input type="text" class="emoji-inp" id="nEmoji" placeholder="🎉" maxlength="4">
    <input type="text" id="nName" placeholder="节日名称（如：生日）" maxlength="16">
    <input type="date" id="nDate">
    <button class="btn" onclick="addFest()">＋ 添加</button>
  </div>

  <div class="tools">
    <button class="btn ghost" onclick="resetHidden()">↺ 恢复默认节日</button>
  </div>

  <footer>100 Apps Challenge · App #013 · 首页最多 15 个（按时间排序）<br>预置按重要性精选 · 农历节日硬编码表 · <b>删除规则</b>：预置=隐藏，自定义=真删</footer>
</div>

<script>
/* ============================================================
   预置节日：国内主要节日，按重要性排序（weight 越小越重要）
   - type:solar = 公历固定（过期年+1 自动滚动）
   - type:fixed = 农历等硬编码日期（过期即不再显示）
   ============================================================ */
const PRESETS=[
  {emoji:"🏮",name:"春节",type:"fixed",date:"2027-02-06",w:1},
  {emoji:"🇨🇳",name:"国庆节",type:"solar",md:"10-01",w:2},
  {emoji:"🌕",name:"中秋节",type:"fixed",date:"2026-09-25",w:3},
  {emoji:"🧨",name:"除夕",type:"fixed",date:"2027-02-05",w:4},
  {emoji:"🍡",name:"元宵节",type:"fixed",date:"2027-02-20",w:5},
  {emoji:"🐉",name:"端午节",type:"fixed",date:"2027-06-09",w:6},
  {emoji:"🌼",name:"清明节",type:"solar",md:"04-05",w:7},
  {emoji:"💪",name:"劳动节",type:"solar",md:"05-01",w:8},
  {emoji:"🎊",name:"元旦",type:"solar",md:"01-01",w:9},
  {emoji:"💑",name:"七夕节",type:"fixed",date:"2027-08-08",w:10},
  {emoji:"🍂",name:"重阳节",type:"fixed",date:"2026-10-18",w:11},
  {emoji:"✨",name:"跨年夜",type:"solar",md:"12-31",w:12},
  {emoji:"🎓",name:"教师节",type:"solar",md:"09-10",w:13},
  {emoji:"🧒",name:"儿童节",type:"solar",md:"06-01",w:14},
  {emoji:"👩",name:"妇女节",type:"solar",md:"03-08",w:15},
];
const MAX_SHOW=15;   /* 首页最多显示（按时间远近取前15） */
const KEY="fest_v2"; /* v2：新增 hidden 黑名单，废弃旧结构 */
const $=id=>document.getElementById(id);
const DAY=86400000;

let customs=[],hidden=[];
try{const s=JSON.parse(localStorage.getItem(KEY));if(s){customs=s.customs||[];hidden=s.hidden||[]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({customs,hidden}))}catch(e){}}

function nextDate(item,now){
  let y=now.getFullYear();
  if(item.type==="fixed"){
    const d=new Date(item.date+"T00:00:00");
    if(d.getTime()+DAY<=now.getTime())return null;
    return d;
  }
  let d=new Date(y+"-"+item.md+"T00:00:00");
  if(d.getTime()+DAY<=now.getTime())d=new Date((y+1)+"-"+item.md+"T00:00:00");
  return d;
}
function lastDate(item,now){
  const y=now.getFullYear();
  if(item.type==="fixed")return new Date(new Date(item.date+"T00:00:00").getTime()-365*DAY);
  let d=new Date(y+"-"+item.md+"T00:00:00");
  if(d.getTime()>now.getTime())d=new Date((y-1)+"-"+item.md+"T00:00:00");
  return d;
}
/* 汇总：预置(未隐藏) + 自定义 → 各自算 next → 过滤过期 → 按时间排序 → 截前 MAX_SHOW */
function allItems(){
  const now=new Date();
  const list=[
    ...PRESETS.filter(p=>!hidden.includes(p.name)).map(p=>({...p,preset:true})),
    ...customs.map((c,i)=>({...c,preset:false,idx:i})),
  ].map(it=>({...it,next:nextDate(it,now)}))
   .filter(it=>it.next)
   .sort((a,b)=>(a.next-b.next)||(a.w||99)-(b.w||99));
  return {list:list.slice(0,MAX_SHOW),now};
}
function fmt(d){
  const w=["日","一","二","三","四","五","六"];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${w[d.getDay()]}`;
}
function pad(n){return String(n).padStart(2,"0")}
function esc(s){return s.replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}

let heroItem=null;
function render(){
  const {list,now}=allItems();
  if(!list.length){
    $("grid").innerHTML=`<div style="text-align:center;color:var(--dim);padding:20px">没有节日了，点下方"恢复默认节日"或添加自定义 🎉</div>`;
    return;
  }
  heroItem=list[0];
  $("hEmoji").textContent=heroItem.emoji;
  $("hName").textContent=heroItem.name;
  $("hDate").textContent=fmt(heroItem.next);

  $("grid").innerHTML=list.slice(1).map(it=>{
    const days=Math.ceil((it.next-now)/DAY);
    const cls=days<=7?"soon":days<=60?"":"far";
    const today=days===0;
    return `<div class="card ${today?'today':''}">
      <button class="del" onclick="delFest('${esc(it.name)}',${it.preset?1:0},${it.idx??-1},this)" title="删除">✕</button>
      <div class="emoji">${it.emoji}</div>
      <div class="name">${esc(it.name)}</div>
      <div class="date">${fmt(it.next)}</div>
      <div class="dd ${cls}">${days===0?"就是今天！🎉":days+"<small>天后</small>"}</div>
    </div>`;
  }).join("");
}

function tick(){
  if(!heroItem)return;
  const now=new Date();
  let diff=heroItem.next-now;
  if(diff<=0){
    $("cD").textContent="🎉";$("cH").textContent="今";$("cM").textContent="天";$("cS").textContent="啦";
    $("hTip").textContent="节日快乐！";
    return;
  }
  const d=Math.floor(diff/DAY);diff-=d*DAY;
  const h=Math.floor(diff/3600000);diff-=h*3600000;
  const m=Math.floor(diff/60000);diff-=m*60000;
  const s=Math.floor(diff/1000);
  $("cD").textContent=d;$("cH").textContent=pad(h);$("cM").textContent=pad(m);$("cS").textContent=pad(s);
  /* 到期提醒：24点前10秒（23:59:50-23:59:59），焦点卡+到期卡片高亮闪烁 */
  const toMidnight=(24*3600)-(now.getHours()*3600+now.getMinutes()*60+now.getSeconds());
  const flashing=toMidnight<=10;
  $("hero").classList.toggle("flash",flashing&&!!heroItem);
  document.querySelectorAll(".card").forEach(c=>{
    c.classList.toggle("flash",flashing&&c.classList.contains("today"));
  });
  if(flashing&&!warned){
    warned=true;
    $("hTip").textContent="⏰ 即将到期！10 秒后进入新的一天";
  }
  if(!flashing&&warned){
    warned=false;
    render();  /* 过了24点：焦点切换+进度条归零，一次性重排 */
  }
}
let warned=false;

/* 删除：预置节日 → 加入隐藏名单；自定义 → 真删。统一二次确认 */
let delKey=null,delTimer=null;
function delFest(name,isPreset,idx,btn){
  const key=name+"|"+idx;
  if(delKey!==key){
    delKey=key;
    document.querySelectorAll(".card .del").forEach(b=>{if(b!==btn){b.textContent="✕";b.style.color="";b.style.borderColor=""}});
    btn.textContent="确认?";
    btn.style.color="var(--red)";btn.style.borderColor="var(--red)";
    clearTimeout(delTimer);
    delTimer=setTimeout(()=>{
      delKey=null;
      btn.textContent="✕";btn.style.color="";btn.style.borderColor="";
    },3000);
    return;
  }
  clearTimeout(delTimer);delKey=null;
  if(isPreset){
    hidden.push(name);          /* 预置：只是隐藏，可随时恢复 */
  }else{
    customs.splice(idx,1);      /* 自定义：真删 */
  }
  save();
  render();
  tick();
}
function resetHidden(){
  hidden=[];
  save();
  render();
  tick();
}
function addFest(){
  const emoji=($("nEmoji").value||"🎉").slice(0,2);
  const name=$("nName").value.trim();
  const date=$("nDate").value;
  if(!name){$("nName").focus();return}
  if(!date){$("nDate").focus();return}
  const d=new Date(date+"T00:00:00");
  if(isNaN(d)||d.getTime()+DAY<=Date.now()){return}
  customs.push({emoji,name,type:"fixed",date});
  /* 从隐藏名单里捞回来（如果重名） */
  const hi=hidden.indexOf(name);
  if(hi>=0){hidden.splice(hi,1)}
  save();
  $("nName").value="";$("nDate").value="";$("nEmoji").value="";
  render();
  tick();
}
$("nName").addEventListener("keydown",e=>{if(e.key==="Enter")addFest()});

render();
tick();
setInterval(tick,1000);
setInterval(render,600000);
</script>
</body>
</html>
