<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⌨️ 打字速度测试 · Typing Test</title>
<style>
:root{
  --bg:#1a1b26; --panel:#232433; --panel2:#2a2b3d; --line:#363850;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --green:#4ec9b0; --blue:#569cd6; --orange:#e5a663; --purple:#c586c0; --red:#e06c75;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 16px}
.app{width:100%;max-width:720px}
h1{font-size:24px;font-weight:700;margin-bottom:4px}
h1 span{background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}

/* 模式选择 */
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.modes button{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;padding:8px 16px;border-radius:18px;cursor:pointer;transition:.15s}
.modes button.on{background:var(--blue);border-color:var(--blue);color:#12131a;font-weight:600}@media(hover:hover){
.modes button:not(.on):hover{border-color:var(--dim);color:var(--text)}}

/* 计时条 */
.bar{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.stat.wpm .v{color:var(--green)}
.stat.acc .v{color:var(--blue)}
.stat.time .v{color:var(--orange)}
.stat.err .v{color:var(--red)}

/* 文本区 */
.text-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
#display{font-size:17px;line-height:2;letter-spacing:.5px;word-break:break-all;min-height:110px}
#display .c{color:var(--dim)}
#display .c.done{color:var(--text)}
#display .c.cur{border-left:2px solid var(--green);margin-left:-2px;color:var(--text)}
#display .c.ok{color:var(--green)}
#display .c.bad{color:var(--red);background:rgba(224,108,117,.15);border-radius:2px}
#display .c.space.bad{background:rgba(224,108,117,.35)}

/* 输入区 */
.input-hint{text-align:center;color:var(--dim);font-size:13px;margin-bottom:10px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--text);font-size:15px;outline:none;font-family:inherit;transition:.15s}
.inp:focus{border-color:var(--green)}
.inp:disabled{opacity:.5}
.inp.err{border-color:var(--red)}

/* 结果 */
.result{display:none;background:var(--panel);border:1px solid var(--green);border-radius:14px;padding:22px;text-align:center;animation:pop .3s ease}
.result.show{display:block}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.result h2{font-size:20px;margin-bottom:6px}
.result .big{font-size:42px;font-weight:700;color:var(--green);margin:10px 0}
.result .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.result .cell{background:var(--panel2);border-radius:10px;padding:12px 6px}
.result .cell .v{font-size:20px;font-weight:700}
.result .cell .l{font-size:11px;color:var(--muted);margin-top:2px}
.result .btn{margin-top:16px;background:var(--green);border:none;color:#12211d;padding:12px 30px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}@media(hover:hover){
.result .btn:hover{filter:brightness(1.1)}}
.result .cmt{color:var(--muted);font-size:13px;margin-top:10px}

footer{text-align:center;color:var(--dim);font-size:12px;margin-top:18px;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <h1>⌨️ <span>打字速度测试</span></h1>
  <div class="sub">中文/英文 · 60秒限时 · 实时WPM与准确率 · 逐字对比</div>

  <div class="modes" id="modes"></div>

  <div class="bar">
    <div class="stat wpm"><div class="v" id="vWpm">0</div><div class="l">WPM 词/分</div></div>
    <div class="stat acc"><div class="v" id="vAcc">100%</div><div class="l">准确率</div></div>
    <div class="stat time"><div class="v" id="vTime">60</div><div class="l">剩余秒数</div></div>
    <div class="stat err"><div class="v" id="vErr">0</div><div class="l">错字数</div></div>
  </div>

  <div class="text-card"><div id="display"></div></div>
  <div class="input-hint" id="hint">点击下方输入框，输入第一个字即开始计时 ⏱️</div>
  <input class="inp" id="inp" placeholder="在这里跟着上面的文字输入…" autocomplete="off" autocapitalize="off" spellcheck="false">

  <div class="result" id="result">
    <h2>🏁 测试完成</h2>
    <div class="big" id="rWpm">0 WPM</div>
    <div class="grid">
      <div class="cell"><div class="v" id="rCpm" style="color:var(--blue)">0</div><div class="l">字符/分 CPM</div></div>
      <div class="cell"><div class="v" id="rAcc" style="color:var(--green)">0%</div><div class="l">准确率</div></div>
      <div class="cell"><div class="v" id="rErr" style="color:var(--red)">0</div><div class="l">错字</div></div>
      <div class="cell"><div class="v" id="rTime" style="color:var(--orange)">0s</div><div class="l">用时</div></div>
    </div>
    <div class="cmt" id="rCmt"></div>
    <button class="btn" onclick="restart()">🔄 再来一轮</button>
  </div>

  <footer>100 Apps Challenge · App #009 · WPM=正确字符数÷5÷分钟数（行业标准）</footer>
</div>

<script>
/* ============================================================
   知识点：
   - WPM 行业算法：正确字符数 ÷ 5 ÷ 分钟（1"词"≈5字符，中英通用）
   - 逐字对比渲染：每个字符一个 span，输入即比对上色（O(1) 更新）
   - 计时用时间戳（Date.now 差值），首字符触发、setInterval 只负责刷新显示
   ============================================================ */
const MODES={
  中文:[
    "星哥的百应用挑战正在火热进行，一天做了好几个小应用，从番茄钟到打字测试，每一个都是亲手写出来的作品",
    "深夜的代码最安静，只有键盘敲击的声音陪伴着开发者，一行行代码像是搭积木一样慢慢垒成高楼",
    "前端开发就像画画，超文本标记语言是画布，层叠样式是颜料，脚本是画笔，三者合在一起就是网页的世界",
    "打字速度快不是目的，准确和节奏才是根本，手指在键盘上跳舞，思想在屏幕上流淌",
    "坚持一百天做一百个应用，听起来很难，但只要每天进步一点点，回头看时已经走了很远很远的路"
  ],
  英文:[
    "The quick brown fox jumps over the lazy dog while the cat watches from the warm windowsill in silence",
    "Practice makes perfect and every keystroke brings you closer to mastery of the keyboard you use daily",
    "Programming is the art of telling another human what one wants the computer to do in clear language",
    "Small daily improvements are the key to staggering long term results so keep typing and keep building",
    "The best way to predict the future is to invent it so build something amazing today and ship it fast"
  ]
};
const DUR=60;

const $=id=>document.getElementById(id);
let mode="中文",text="",typed="",startAt=0,timer=null,finished=false,errors=0;

/* ---------- 模式 ---------- */
function renderModes(){
  $("modes").innerHTML=Object.keys(MODES).map(m=>
    `<button class="${m===mode?"on":""}" onclick="setMode('${m}')">${m==="中文"?"🇨🇳 中文":"🇬🇧 英文"}</button>`).join("");
}
function setMode(m){mode=m;renderModes();newRound()}

/* ---------- 新一轮 ---------- */
function newRound(){
  text=MODES[mode][Math.floor(Math.random()*MODES[mode].length)];
  typed="";startAt=0;finished=false;errors=0;
  clearInterval(timer);timer=null;
  $("inp").value="";$("inp").disabled=false;$("inp").classList.remove("err");
  $("hint").textContent="点击下方输入框，输入第一个字即开始计时 ⏱️";
  $("result").classList.remove("show");
  $("vWpm").textContent="0";$("vAcc").textContent="100%";$("vTime").textContent=DUR;$("vErr").textContent="0";
  renderText();updateStats();
}
function restart(){newRound();$("inp").focus()}

/* ---------- 逐字渲染 ---------- */
function renderText(){
  let html="";
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    const isSpace=ch===" ";
    let cls="c";
    if(i<typed.length)cls+=typed[i]===ch?" ok":(isSpace?" space":"")+" bad";
    else if(i===typed.length)cls+=" cur";
    html+=`<span class="${cls}">${ch===" "?"&nbsp;":ch}</span>`;
  }
  $("display").innerHTML=html;
}

/* ---------- 输入处理 ---------- */
$("inp").addEventListener("input",e=>{
  if(finished)return;
  typed=e.target.value;
  if(typed.length>text.length){typed=text.slice(0,text.length);e.target.value=typed}
  if(!startAt&&typed.length>0){
    startAt=Date.now();
    $("hint").textContent="计时开始！保持节奏 💪";
    timer=setInterval(tick,200);
  }
  renderText();updateStats();
  if(typed.length===text.length)end();
});
$("inp").addEventListener("keydown",e=>{
  /* 阻止输入框内方向键移动光标（必须顺序输入） */
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"].includes(e.key))e.preventDefault();
});

/* ---------- 统计 ---------- */
function countErr(){
  let n=0;
  for(let i=0;i<typed.length;i++)if(typed[i]!==text[i])n++;
  return n;
}
function updateStats(){
  errors=countErr();
  const elapsed=startAt?(Date.now()-startAt)/1000:0;
  const correct=typed.length-errors;
  const wpm=elapsed>0?Math.round(correct/5/(elapsed/60)):0;
  const acc=typed.length?Math.round(correct/typed.length*100):100;
  $("vWpm").textContent=wpm;
  $("vAcc").textContent=acc+"%";
  $("vErr").textContent=errors;
}
function tick(){
  const left=Math.max(0,DUR-(Date.now()-startAt)/1000);
  $("vTime").textContent=Math.ceil(left);
  updateStats();
  if(left<=0)end();
}

/* ---------- 结束 ---------- */
function end(){
  if(finished)return;
  finished=true;
  clearInterval(timer);
  const elapsed=Math.min((Date.now()-startAt)/1000,DUR);
  errors=countErr();
  const correct=typed.length-errors;
  const wpm=Math.round(correct/5/(elapsed/60));
  const cpm=Math.round(correct/(elapsed/60));
  const acc=typed.length?Math.round(correct/typed.length*100):0;
  $("rWpm").textContent=wpm+" WPM";
  $("rCpm").textContent=cpm;
  $("rAcc").textContent=acc+"%";
  $("rErr").textContent=errors;
  $("rTime").textContent=Math.round(elapsed)+"s";
  $("rCmt").textContent=
    wpm>=80?"🔥 职业级选手！这手速可以接单了":
    wpm>=50?"💪 高手！超过绝大多数人":
    wpm>=30?"👍 不错，日常水平，还有提升空间":
    "🌱 慢慢来，准确率优先，速度会跟上来的";
  $("result").classList.add("show");
  $("inp").disabled=true;
  $("hint").textContent="完成！看看成绩 👆";
}

/* ---------- 启动 ---------- */
renderModes();newRound();
</script>
</body>
</html>
