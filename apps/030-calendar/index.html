<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 日历应用 · Calendar</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6; --purple:#c586c0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-anchor:none}
body{background:radial-gradient(ellipse at 50% 0%,#1e2230 0%,var(--bg) 60%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}
.nav{display:flex;align-items:center;gap:10px}
.nav button{background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:14px;width:36px;height:36px;border-radius:10px;cursor:pointer;outline:none}
@media(hover:hover){.nav button:hover{border-color:var(--gold);color:var(--gold)}}
.nav .ym{font-size:17px;font-weight:700;min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
.today-btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:7px 14px;border-radius:9px;cursor:pointer;outline:none}
@media(hover:hover){.today-btn:hover{color:var(--gold);border-color:var(--gold)}}

/* 星期头 */
.week-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.week-head div{text-align:center;font-size:11px;color:var(--dim);letter-spacing:1px;padding:6px 0}
.week-head .wk{color:var(--red)}

/* 月格 */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:72px;padding:8px 9px;cursor:pointer;position:relative;transition:border-color .15s;display:flex;flex-direction:column}
@media(hover:hover){.cell:hover{border-color:var(--dim)}}
.cell.other{opacity:.32}
.cell.today{border-color:var(--gold);box-shadow:0 0 12px rgba(229,181,103,.2)}
.cell.sel{border-color:var(--blue);box-shadow:0 0 12px rgba(86,156,214,.25)}
.cell .d{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cell.today .d{color:var(--gold)}
.cell .d.wknd{color:var(--red)}
.cell .evs{margin-top:5px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.dot-ev{font-size:9.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1.5px 6px;border-radius:6px;background:rgba(86,156,214,.16);color:var(--blue)}
.dot-ev.more{background:transparent;color:var(--dim);text-align:left}

/* 事件面板 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.panel h3{font-size:13px;color:var(--muted);letter-spacing:2px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.panel h3 .sel-date{color:var(--gold);font-size:14px}
.add-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.add-row input[type=text]{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13px;padding:9px 12px;border-radius:9px;outline:none;-webkit-user-select:text;user-select:text}
.add-row input:focus{border-color:var(--gold)}
.add-row select{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:12px;padding:9px;border-radius:9px;outline:none;cursor:pointer}
.add-btn{background:var(--gold);border:none;color:#1a1a22;font-size:12px;font-weight:700;padding:9px 18px;border-radius:9px;cursor:pointer;outline:none}
.add-btn:active{filter:brightness(1.2)}
.ev-list{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:10px 12px}
.ev .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ev .tx{flex:1;font-size:13px;word-break:break-all}
.ev .tm{font-size:10px;color:var(--dim)}
.ev .del{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:3px 8px;border-radius:6px;outline:none}
@media(hover:hover){.ev .del:hover{color:var(--red)}}
.ev .del.armed{color:var(--red);border:1px solid var(--red)}
.no-ev{color:var(--dim);font-size:12px;text-align:center;padding:12px}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}
@media(max-width:560px){
  .cell{min-height:56px;padding:6px 7px}
  .cell .d{font-size:12px}
  .dot-ev{display:none}
  .cell .evs{flex-direction:row;gap:3px;margin-top:4px}
  .evdot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>日历</h1>
      <div class="sub">月视图 · 添加事件 · 今日高亮</div>
    </div>
    <div class="nav">
      <button onclick="moveMonth(-1)">‹</button>
      <div class="ym" id="ym">—</div>
      <button onclick="moveMonth(1)">›</button>
      <button class="today-btn" onclick="goToday()">今天</button>
    </div>
  </header>

  <div class="week-head">
    <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="wk">六</div><div class="wk">日</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="panel">
    <h3>📝 事件 <span class="sel-date" id="selDate">—</span></h3>
    <div class="add-row">
      <input type="text" id="evTxt" placeholder="事件内容，如：团队周会" maxlength="40" onkeydown="if(event.key==='Enter')addEvent()">
      <select id="evColor">
        <option value="blue">蓝</option>
        <option value="green">绿</option>
        <option value="gold">金</option>
        <option value="red">红</option>
        <option value="purple">紫</option>
      </select>
      <button class="add-btn" onclick="addEvent()">＋ 添加</button>
    </div>
    <div class="ev-list" id="evList"></div>
  </div>

  <footer>100 Apps Challenge · App #030 · 🎉 <b>30% 里程碑</b> · 月视图 6 周网格（前补上月尾/后补下月头）<br>事件数据 events{date:[{text,color}]} · localStorage 持久化 · 五色标记</footer>
</div>

<script>
/* ============================================================
   新知识点：月历网格生成
   - JS Date 的 getDay() 周日=0，转周一制：(day+6)%7
   - 月视图 42 格 = 6 行 × 7 列：
     本月 1 号前补上月尾尾几天，末尾补下月头几天
   - 事件按日期分组存 events{ "2026-08-28":[{text,color}] }
     渲染时按格子的日期键取列表
   ============================================================ */
const $=id=>document.getElementById(id);
const KEY="calendar_v1";
const COLORS={blue:"#569cd6",green:"#4ec9b0",gold:"#e5b567",red:"#e06c75",purple:"#c586c0"};

let viewY,viewM;          /* 当前视图年月 */
let selDate=null;         /* 选中的日期串 */
let events={};            /* {date:[{text,color}]} */

try{events=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){}}

function dstr2(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
const WD=["一","二","三","四","五","六","日"];

function init(){
  const t=new Date();
  viewY=t.getFullYear();viewM=t.getMonth();
  selDate=dstr2(viewY,viewM,t.getDate());
}
function moveMonth(n){
  viewM+=n;
  if(viewM<0){viewM=11;viewY--}
  if(viewM>11){viewM=0;viewY++}
  render();
}
function goToday(){
  const t=new Date();
  viewY=t.getFullYear();viewM=t.getMonth();
  selDate=dstr2(viewY,viewM,t.getDate());
  render();
}

/* ---------- 渲染 ---------- */
function render(){
  $("ym").textContent=viewY+" 年 "+(viewM+1)+" 月";
  const today=new Date();
  const todayS=dstr2(today.getFullYear(),today.getMonth(),today.getDate());
  /* 本月1号在周几（周一制） */
  const firstDow=(new Date(viewY,viewM,1).getDay()+6)%7;
  /* 上月最后一天 */
  const prevLast=new Date(viewY,viewM,0).getDate();
  /* 本月天数 */
  const daysInMonth=new Date(viewY,viewM+1,0).getDate();
  /* 42格：从本月1号往前 firstDow 天开始 */
  let html="";
  const start=new Date(viewY,viewM,1-firstDow);
  for(let i=0;i<42;i++){
    const cur=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const ds=dstr2(cur.getFullYear(),cur.getMonth(),cur.getDate());
    const inMonth=cur.getMonth()===viewM;
    const isToday=ds===todayS;
    const isSel=ds===selDate;
    const dow=WD[(cur.getDay()+6)%7];
    const isWknd=cur.getDay()===0||cur.getDay()===6;
    const evs=events[ds]||[];
    /* 事件标记：桌面显示文字条，移动端只显示色点 */
    let evHtml="";
    if(evs.length){
      evHtml=evs.slice(0,2).map(e=>
        `<span class="dot-ev" style="background:${COLORS[e.color]}22;color:${COLORS[e.color]}">${esc(e.text)}</span>`
      ).join("");
      if(evs.length>2)evHtml+=`<span class="dot-ev more">+${evs.length-2}</span>`;
      /* 移动端色点 */
      evHtml+=`<span class="evdot" style="background:${COLORS[evs[0].color]};display:none"></span>`;
    }
    html+=`<div class="cell ${inMonth?"":"other"} ${isToday?"today":""} ${isSel?"sel":""}" onclick="pick('${ds}')">
      <div class="d ${isWknd?"wknd":""}">${cur.getDate()}</div>
      <div class="evs">${evHtml}</div>
    </div>`;
  }
  $("grid").innerHTML=html;
  renderEvents();
}
function pick(ds){
  selDate=ds;
  render();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- 事件 CRUD ---------- */
function addEvent(){
  const txt=$("evTxt").value.trim();
  if(!txt){toast("先写事件内容 📝");return}
  if(!selDate){toast("先选一个日期");return}
  if(!events[selDate])events[selDate]=[];
  if(events[selDate].some(e=>e.text===txt)){toast("该日已有同名事件");return}
  events[selDate].push({text:txt,color:$("evColor").value});
  $("evTxt").value="";
  save();render();
  toast("已添加 ✅");
}
let delArmed=null,delTimer=null;
function delEvent(ds,i,btn){
  if(delArmed!==ds+"-"+i){
    delArmed=ds+"-"+i;
    if(btn){btn.classList.add("armed");btn.textContent="确认?"}
    clearTimeout(delTimer);
    delTimer=setTimeout(()=>{delArmed=null;if(btn){btn.classList.remove("armed");btn.textContent="✕"}},2500);
    return;
  }
  clearTimeout(delTimer);delArmed=null;
  events[ds].splice(i,1);
  if(!events[ds].length)delete events[ds];
  save();render();
  toast("已删除");
}

/* ---------- 选中日事件列表 ---------- */
function renderEvents(){
  const d=selDate?new Date(selDate+"T00:00"):null;
  $("selDate").textContent=selDate?`${d.getMonth()+1}月${d.getDate()}日 周${WD[(d.getDay()+6)%7]}`:"—";
  const list=selDate?(events[selDate]||[]):[];
  $("evList").innerHTML=list.length?list.map((e,i)=>
    `<div class="ev">
      <span class="sw" style="background:${COLORS[e.color]}"></span>
      <span class="tx">${esc(e.text)}</span>
      <span class="tm">${COLORS[e.color]?"":""}${e.color}</span>
      <button class="del" onclick="delEvent('${selDate}',${i},this)">✕</button>
    </div>`
  ).join(""):`<div class="no-ev">这天没有事件，上方添加一个</div>`;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  let t=document.getElementById("toastBox");
  if(!t){
    t=document.createElement("div");t.id="toastBox";
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 22px;border-radius:11px;font-size:13px;z-index:99";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{const el=document.getElementById("toastBox");if(el)el.remove()},1600);
}

init();
render();
</script>
</body>
</html>
