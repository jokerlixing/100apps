<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111820">
  <meta name="description" content="PRISM/60 是一个完全在浏览器本地运行的图片裁剪、调色、加字与导出工具。">
  <title>PRISM/60 · 本地图片编辑器</title>
  <link rel="stylesheet" href="styles.css">
  <script src="editor-core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="返回 100 Apps Challenge">
        <span class="brand-aperture" aria-hidden="true"><i></i></span>
        <span>
          <h1 class="brand-name">PRISM</h1>
          <span class="brand-index">/ 060</span>
        </span>
      </a>

      <div class="file-readout" aria-label="当前图片信息">
        <span class="file-state" id="sourceBadge">样例画面</span>
        <strong id="fileName">AFTERGLOW-DEMO.PNG</strong>
        <span id="fileDimensions">1600 × 1000 PX</span>
      </div>

      <div class="top-actions">
        <input id="fileInput" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/webp">
        <label class="button button-quiet import-button" for="fileInput">
          <span aria-hidden="true">＋</span> 导入
        </label>
        <button class="icon-button" id="undoButton" type="button" title="撤销 (Ctrl/⌘ + Z)" aria-label="撤销" disabled>↶</button>
        <button class="icon-button" id="redoButton" type="button" title="重做 (Ctrl/⌘ + Shift + Z)" aria-label="重做" disabled>↷</button>
        <button class="button button-primary" id="topExportButton" type="button">导出成片 <span aria-hidden="true">↗</span></button>
      </div>
    </header>

    <main class="workspace">
      <nav class="tool-rail" aria-label="编辑工具">
        <button class="tool-button is-active" type="button" data-scroll-to="cropPanel" aria-label="裁剪工具">
          <span class="tool-glyph crop-glyph" aria-hidden="true"></span>
          <span>裁剪</span>
        </button>
        <button class="tool-button" type="button" data-scroll-to="filterPanel" aria-label="调色工具">
          <span class="tool-glyph dials-glyph" aria-hidden="true"></span>
          <span>调色</span>
        </button>
        <button class="tool-button" type="button" data-scroll-to="textPanel" aria-label="文字工具">
          <span class="tool-glyph text-glyph" aria-hidden="true">T</span>
          <span>文字</span>
        </button>
        <button class="tool-button" type="button" data-scroll-to="exportPanel" aria-label="导出工具">
          <span class="tool-glyph export-glyph" aria-hidden="true">↓</span>
          <span>导出</span>
        </button>
        <span class="rail-spacer"></span>
        <button class="tool-button" id="resetButton" type="button" aria-label="复原所有编辑">
          <span class="tool-glyph reset-glyph" aria-hidden="true">↺</span>
          <span>复原</span>
        </button>
      </nav>

      <section class="stage-panel" aria-label="图片预览工作区">
        <div class="stage-toolbar">
          <div>
            <span class="eyebrow">LIGHT TABLE</span>
            <strong id="viewModeLabel">编辑预览</strong>
          </div>
          <div class="stage-toolbar-actions">
            <button class="text-button" id="loadDemoButton" type="button">载入样例</button>
            <span class="privacy-chip"><span aria-hidden="true">●</span> 图片不上传</span>
          </div>
        </div>

        <div class="drop-zone" id="dropZone">
          <div class="canvas-viewport" id="canvasViewport">
            <div class="canvas-shell" id="canvasShell">
              <canvas id="previewCanvas" width="1600" height="1000" aria-label="图片编辑预览"></canvas>
              <div class="crop-overlay" id="cropOverlay" hidden>
                <div class="crop-box" id="cropBox" role="img" aria-label="裁剪选择框，可拖动或拉动四角">
                  <span class="crop-size" id="cropSize">1600 × 1000</span>
                  <i class="crop-handle handle-nw" data-handle="nw" aria-hidden="true"></i>
                  <i class="crop-handle handle-ne" data-handle="ne" aria-hidden="true"></i>
                  <i class="crop-handle handle-sw" data-handle="sw" aria-hidden="true"></i>
                  <i class="crop-handle handle-se" data-handle="se" aria-hidden="true"></i>
                </div>
              </div>
            </div>
          </div>
          <p class="drop-hint"><span aria-hidden="true">⌁</span> 拖放或粘贴图片到工作台</p>
        </div>

        <div class="calibration-strip" aria-label="当前校色参数">
          <div class="calibration-channel channel-red">
            <span>BRI</span><i></i><strong id="calibrationBrightness">100</strong>
          </div>
          <div class="calibration-channel channel-green">
            <span>SAT</span><i></i><strong id="calibrationSaturation">100</strong>
          </div>
          <div class="calibration-channel channel-blue">
            <span>CON</span><i></i><strong id="calibrationContrast">100</strong>
          </div>
        </div>

        <footer class="stage-footer">
          <span id="outputReadout">输出 1600 × 1000 PX</span>
          <span id="zoomReadout">适合窗口</span>
          <span>SRGB · LOCAL</span>
        </footer>
      </section>

      <aside class="inspector" id="inspector" aria-label="编辑参数">
        <section class="inspector-section" id="cropPanel">
          <div class="section-heading">
            <div><span class="section-code">CROP</span><h2>画面裁剪</h2></div>
            <span class="section-state" id="cropState">待调整</span>
          </div>
          <div class="ratio-grid" role="group" aria-label="裁剪比例">
            <button class="choice-button is-selected" type="button" data-ratio="free"><span>自由</span><small>FREE</small></button>
            <button class="choice-button" type="button" data-ratio="1"><span>1:1</span><small>SQUARE</small></button>
            <button class="choice-button" type="button" data-ratio="0.8"><span>4:5</span><small>POST</small></button>
            <button class="choice-button" type="button" data-ratio="1.777777"><span>16:9</span><small>WIDE</small></button>
          </div>
          <div class="crop-actions">
            <button class="button button-secondary" id="cancelCropButton" type="button" hidden>取消</button>
            <button class="button button-accent" id="applyCropButton" type="button">开始裁剪</button>
          </div>
        </section>

        <section class="inspector-section" id="filterPanel">
          <div class="section-heading">
            <div><span class="section-code">COLOR</span><h2>影调与质感</h2></div>
            <button class="section-reset" id="resetFiltersButton" type="button">归零</button>
          </div>
          <div class="preset-row" role="group" aria-label="滤镜预设">
            <button class="preset-button is-selected" type="button" data-preset="original"><i class="preset-swatch preset-original"></i>原片</button>
            <button class="preset-button" type="button" data-preset="warm"><i class="preset-swatch preset-warm"></i>暖光</button>
            <button class="preset-button" type="button" data-preset="mono"><i class="preset-swatch preset-mono"></i>黑白</button>
            <button class="preset-button" type="button" data-preset="vivid"><i class="preset-swatch preset-vivid"></i>鲜明</button>
          </div>
          <div class="slider-stack">
            <label class="range-control" for="brightnessInput"><span>亮度 <output id="brightnessValue">100</output></span><input id="brightnessInput" data-filter="brightness" type="range" min="0" max="200" value="100"></label>
            <label class="range-control" for="contrastInput"><span>对比度 <output id="contrastValue">100</output></span><input id="contrastInput" data-filter="contrast" type="range" min="0" max="200" value="100"></label>
            <label class="range-control" for="saturationInput"><span>饱和度 <output id="saturationValue">100</output></span><input id="saturationInput" data-filter="saturation" type="range" min="0" max="200" value="100"></label>
            <label class="range-control" for="grayscaleInput"><span>灰度 <output id="grayscaleValue">0</output></span><input id="grayscaleInput" data-filter="grayscale" type="range" min="0" max="100" value="0"></label>
            <label class="range-control" for="sepiaInput"><span>棕褐 <output id="sepiaValue">0</output></span><input id="sepiaInput" data-filter="sepia" type="range" min="0" max="100" value="0"></label>
            <label class="range-control" for="blurInput"><span>柔焦 <output id="blurValue">0</output></span><input id="blurInput" data-filter="blur" type="range" min="0" max="8" step="0.25" value="0"></label>
          </div>
        </section>

        <section class="inspector-section" id="textPanel">
          <div class="section-heading">
            <div><span class="section-code">TYPE</span><h2>画面文字</h2></div>
            <button class="section-reset" id="clearTextButton" type="button">清除</button>
          </div>
          <label class="field-control" for="textInput">
            <span>内容 <small id="textCount">0 / 80</small></span>
            <input id="textInput" type="text" maxlength="80" placeholder="输入一句标题">
          </label>
          <div class="text-grid">
            <label class="range-control compact" for="textSizeInput"><span>字号 <output id="textSizeValue">7%</output></span><input id="textSizeInput" type="range" min="2" max="16" step="0.5" value="7"></label>
            <label class="color-control" for="textColorInput"><span>颜色</span><input id="textColorInput" type="color" value="#ffffff"><i id="colorValue">#FFFFFF</i></label>
          </div>
          <div class="segmented-control" role="group" aria-label="文字横向位置">
            <button type="button" data-align="left" aria-label="左对齐">左</button>
            <button class="is-selected" type="button" data-align="center" aria-label="居中对齐">中</button>
            <button type="button" data-align="right" aria-label="右对齐">右</button>
          </div>
          <div class="segmented-control position-control" role="group" aria-label="文字纵向位置">
            <button type="button" data-position="top">顶部</button>
            <button class="is-selected" type="button" data-position="center">中央</button>
            <button type="button" data-position="bottom">底部</button>
          </div>
        </section>

        <section class="inspector-section export-section" id="exportPanel">
          <div class="section-heading">
            <div><span class="section-code">OUTPUT</span><h2>导出设置</h2></div>
            <span class="section-state">本地生成</span>
          </div>
          <div class="export-grid">
            <label class="select-control" for="formatSelect"><span>格式</span><select id="formatSelect"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WEBP</option></select></label>
            <label class="range-control compact" for="qualityInput"><span>质量 <output id="qualityValue">92%</output></span><input id="qualityInput" type="range" min="40" max="100" value="92"></label>
          </div>
          <div class="scale-row" role="group" aria-label="导出尺寸">
            <button type="button" data-scale="0.5">50%</button>
            <button type="button" data-scale="0.75">75%</button>
            <button class="is-selected" type="button" data-scale="1">原尺寸</button>
          </div>
          <button class="button button-primary export-button" id="exportButton" type="button"><span>下载图片</span><strong id="exportDimensions">1600 × 1000</strong></button>
          <p class="export-note">导出在本机完成，不会发送原图或编辑结果。</p>
        </section>
      </aside>
    </main>

    <div class="status-toast" id="statusToast" role="status" aria-live="polite" aria-atomic="true">
      <span class="status-light" aria-hidden="true"></span>
      <span id="statusMessage">样例画面已就绪，可以直接试用或导入自己的图片。</span>
    </div>
    <canvas id="exportCanvas" hidden></canvas>
  </div>
</body>
</html>
