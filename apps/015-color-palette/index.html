<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 配色方案生成器 · Color Palette</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 20%,#1e2230 0%,var(--bg) 65%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:820px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.harmony{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.harmony button{background:var(--panel);border:none;color:var(--muted);font-size:12px;padding:8px 12px;cursor:pointer;transition:.15s;outline:none}
.harmony button.on{background:rgba(229,181,103,.15);color:var(--gold);font-weight:600}
.btn{background:var(--gold);border:none;color:#1a1a22;font-size:13px;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer;transition:.15s;outline:none}@media(hover:hover){
.btn:hover{filter:brightness(1.1)}}
.btn.ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-weight:400;font-size:12px;padding:8px 14px}

/* 调节面板 */
.controls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.ctrl{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
.ctrl label{font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:1px}
input[type=range]{flex:1;accent-color:var(--gold);height:4px;cursor:pointer;min-width:70px}
.ctrl .cv{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

/* 色卡流 */
.pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.swatch{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid rgba(255,255,255,.06);min-height:170px;display:flex;flex-direction:column;justify-content:flex-end}@media(hover:hover){
.swatch:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.45)}}
.swatch .meta{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.swatch .hex{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#fff}
.swatch .rgb{font-size:9px;color:rgba(255,255,255,.55);margin-top:2px;font-variant-numeric:tabular-nums}
.swatch .copy{background:rgba(255,255,255,.14);border:none;color:#fff;font-size:11px;padding:4px 9px;border-radius:7px;cursor:pointer;transition:.15s;outline:none;white-space:nowrap}@media(hover:hover){
.swatch .copy:hover{background:rgba(255,255,255,.3)}}
/* 圆形毛玻璃锁按钮：桌面精致、移动端状态分明 */
.swatch .lock{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none;transition:all .2s cubic-bezier(.25,.46,.45,.94);
  background:rgba(15,17,22,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.22);color:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.swatch .lock svg{width:17px;height:17px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}@media(hover:hover){
.swatch .lock:hover{background:rgba(15,17,22,.62);transform:scale(1.08);border-color:rgba(255,255,255,.4)}}
.swatch .lock:active{transform:scale(.94)}
/* 锁定态：白底金色光环，深色图标——任何色卡上都醒目 */
.swatch .lock.on{background:rgba(255,255,255,.96);color:#17191f;border-color:rgba(229,181,103,.9);
  box-shadow:0 2px 14px rgba(0,0,0,.35),0 0 0 3px rgba(229,181,103,.35),0 0 22px rgba(229,181,103,.45)}
.swatch .lock.on svg{filter:none}@media(hover:hover){
.swatch .lock.on:hover{background:#fff;transform:scale(1.08)}}
.swatch.locked{box-shadow:0 0 0 2px var(--gold)}

/* 预览区 */
.preview{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.preview-tabs{display:flex;border-bottom:1px solid var(--line)}
.preview-tabs button{flex:1;background:none;border:none;color:var(--dim);font-size:12px;padding:11px;cursor:pointer;transition:.15s;outline:none;letter-spacing:1px}
.preview-tabs button.on{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.pv-body{padding:24px;min-height:200px}
/* 卡片式预览 */
.pv-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pv-card{border-radius:12px;padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.pv-card .t{font-size:13px;font-weight:700}
.pv-card .d{font-size:10px;opacity:.75;line-height:1.5}
/* 渐变预览 */
.pv-gradient{height:180px;border-radius:12px}
.pv-grad-info{text-align:center;color:var(--dim);font-size:11px;margin-top:10px;font-variant-numeric:tabular-nums}
/* 网页预览 */
.pv-page{display:flex;flex-direction:column;gap:14px}
.pv-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:700}
.pv-nav .links{display:flex;gap:12px;font-size:11px;font-weight:400;opacity:.8}
.pv-hero{border-radius:10px;padding:26px;text-align:center}
.pv-hero .h{font-size:18px;font-weight:800;margin-bottom:8px}
.pv-hero .p{font-size:11px;opacity:.8}
.pv-cta{border:none;border-radius:8px;padding:9px 22px;font-size:12px;font-weight:700;cursor:default;margin-top:12px}
.pv-foot{border-radius:10px;padding:10px 16px;font-size:10px;text-align:center;opacity:.85}

/* 收藏 */
.favs{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.favs h3{font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.favs h3 button{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--dim);font-size:11px;cursor:pointer;padding:3px 10px;border-radius:8px;outline:none;transition:.15s}@media(hover:hover){
.favs h3 button:hover{color:var(--red);border-color:var(--red)}}
.fav-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.fav-row:last-child{border-bottom:none}
.fav-dots{display:flex;gap:3px;flex:1;cursor:pointer}
.fav-dots div{width:22px;height:22px;border-radius:6px}
.fav-row .txt{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.fav-row .del{background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer;outline:none;padding:2px 6px;border-radius:6px}@media(hover:hover){
.fav-row .del:hover{color:var(--red)}}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:6px}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--green);color:var(--text);padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>配色方案生成器</h1>
      <div class="sub">HSL 色彩和谐理论 · 锁色微调 · 实时场景预览</div>
    </div>
    <div class="toolbar">
      <div class="harmony" id="harmBox">
        <button class="on" data-h="analogous">类比</button>
        <button data-h="complementary">互补</button>
        <button data-h="triadic">三等分</button>
        <button data-h="tetradic">四等分</button>
        <button data-h="monochrome">单色</button>
      </div>
      <button class="btn" onclick="generate()">🎲 生成</button>
    </div>
  </header>

  <div class="controls">
    <div class="ctrl"><label>基础色相</label><input type="range" id="hue" min="0" max="360" value="210" oninput="onTune()"><span class="cv" id="hueV">210°</span></div>
    <div class="ctrl"><label>饱和度</label><input type="range" id="sat" min="10" max="95" value="65" oninput="onTune()"><span class="cv" id="satV">65%</span></div>
    <div class="ctrl"><label>亮度</label><input type="range" id="light" min="25" max="85" value="55" oninput="onTune()"><span class="cv" id="lightV">55%</span></div>
  </div>

  <div class="pal" id="pal"></div>

  <div class="preview">
    <div class="preview-tabs">
      <button class="on" onclick="setPv(this,'cards')">卡片</button>
      <button onclick="setPv(this,'gradient')">渐变</button>
      <button onclick="setPv(this,'page')">网页</button>
    </div>
    <div class="pv-body" id="pvBody"></div>
  </div>

  <div class="favs">
    <h3>⭐ 收藏的方案 <button onclick="clearFavs()">清空</button></h3>
    <div id="favList"></div>
    <button class="btn ghost" onclick="favCurrent()" style="width:100%;margin-top:10px">⭐ 收藏当前配色</button>
  </div>

  <footer>100 Apps Challenge · App #015 · <b>HSL 色彩和谐</b>：色环上等角度取色<br>类比=相邻30° · 互补=180° · 三等分=120° · 单色=同相不同明度</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   新知识点：HSL 色彩模型与和谐配色理论
   - HSL = 色相(0-360°色环) + 饱和度 + 亮度，比 RGB 更符合
     人类直觉（"更蓝一点""淡一点"就是调 H/S/L）
   - 和谐公式 = 色环上的几何关系：
     类比 [0,30,60,90,120] 相邻渐变，自然柔和
     互补 [0,180] 强对比，CTA 按钮常用
     三等分 [0,120,240] 三足鼎立，活泼平衡
     四等分 [0,90,180,270] 双互补，丰富
     单色 同 H，变 S/L 层次，极简风
   - hsl→hex 输出（设计工具通吃）
   ============================================================ */
const KEY="palette_v1";
const $=id=>document.getElementById(id);
let harmony="analogous";
let pvMode="cards";
let locks=[false,false,false,false,false];
let cur=[null,null,null,null,null];   /* 当前5色 [{h,s,l}] */
let favs=[];
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)favs=s.favs||[]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({favs}))}catch(e){}}

const HARM={
  analogous:{offsets:[0,25,50,75,100],name:"类比"},
  complementary:{offsets:[0,15,-15,180,195],name:"互补"},
  triadic:{offsets:[0,120,240,20,140],name:"三等分"},
  tetradic:{offsets:[0,90,180,270,45],name:"四等分"},
  monochrome:{offsets:[0,0,0,0,0],name:"单色"},
};
/* 单色模式：同色相，错开亮度/饱和度 */
function schemeColors(){
  const h=+$("hue").value,s=+$("sat").value,l=+$("light").value;
  const out=[];
  if(harmony==="monochrome"){
    const L=[Math.min(92,l+28),l+14,l,l-14,Math.max(8,l-28)];
    const S=[Math.max(10,s-30),s-15,s,s+5,Math.max(10,s-10)];
    for(let i=0;i<5;i++)out.push({h,s:S[i],l:L[i]});
  }else{
    const off=HARM[harmony].offsets;
    const L=[l+22,l+8,l,l-8,l-22];
    for(let i=0;i<5;i++)out.push({h:(h+off[i]+360)%360,s,l:L[i]});
  }
  /* 锁定的颜色不覆盖 */
  return out.map((c,i)=>locks[i]&&cur[i]?cur[i]:c);
}
function hsl2hex(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const to=x=>Math.round(255*x).toString(16).padStart(2,"0");
  return "#"+to(f(0))+to(f(8))+to(f(4));
}
function hsl2rgb(h,s,l){
  const hex=hsl2hex(h,s,l);
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)].join(",");
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}

/* 开锁/关锁 SVG 图标（矢量跨设备一致 + 精致细节：钥匙孔/圆角锁体/明显钩子差异） */
const LOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="3"/><path d="M8 10.5V7a4 4 0 0 1 8 0v1.5"/><circle cx="12" cy="15.6" r="1.3" fill="currentColor" stroke="none"/><path d="M12 16.9v1.6" stroke-width="1.6"/></svg>';
const UNLOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="3"/><path d="M8 10.5V7a4 4 0 0 1 7.7-1.5"/><circle cx="12" cy="15.6" r="1.3" fill="currentColor" stroke="none"/><path d="M12 16.9v1.6" stroke-width="1.6"/></svg>';

/* 渲染色卡 */
function render(){
  cur=schemeColors();
  $("pal").innerHTML=cur.map((c,i)=>{
    const hex=hsl2hex(c.h,c.s,c.l).toUpperCase();
    const rgb=hsl2rgb(c.h,c.s,c.l);
    return `<div class="swatch ${locks[i]?'locked':''}" style="background:hsl(${c.h},${c.s}%,${c.l}%)" onclick="copyHex('${hex}',event)">
      <button class="lock ${locks[i]?'on':''}" onclick="toggleLock(${i},event)" title="${locks[i]?'解锁':'锁定此色'}">${locks[i]?LOCK_SVG:UNLOCK_SVG}</button>
      <div class="meta" onclick="event.stopPropagation()">
        <div><div class="hex">${hex}</div><div class="rgb">rgb(${rgb})<br>H${c.h}° S${c.s}% L${c.l}%</div></div>
        <button class="copy" onclick="copyHex('${hex}',event)">复制</button>
      </div>
    </div>`;
  }).join("");
  renderPv();
}
/* 预览 */
function renderPv(){
  const cs=cur.map(c=>`hsl(${c.h},${c.s}%,${c.l}%)`);
  const hexs=cur.map(c=>hsl2hex(c.h,c.s,c.l));
  const body=$("pvBody");
  if(pvMode==="cards"){
    const roles=["主色 Primary","次色 Secondary","强调 Accent","浅色 Surface","深色 Dark"];
    const txt=i=>cur[i].l>60?"#1a1a22":"rgba(255,255,255,.92)";
    body.innerHTML=`<div class="pv-cards">${cs.map((c,i)=>`
      <div class="pv-card" style="background:${c};color:${txt(i)}">
        <div class="t">${roles[i]}</div>
        <div class="d">${hexs[i].toUpperCase()}<br>卡片/按钮/背景</div>
      </div>`).join("")}</div>`;
  }else if(pvMode==="gradient"){
    body.innerHTML=`<div class="pv-gradient" style="background:linear-gradient(135deg,${cs[0]} 0%,${cs[2]} 50%,${cs[4]} 100%)"></div>
    <div class="pv-grad-info">linear-gradient(135deg, ${hexs[0].toUpperCase()} → ${hexs[2].toUpperCase()} → ${hexs[4].toUpperCase()})</div>`;
  }else{
    const dark=cs[4],mid=cs[2],light=cs[0],accent=cs[3];
    body.innerHTML=`<div class="pv-page">
      <div class="pv-nav" style="background:${mid};color:#fff">
        <span>✦ Brand</span>
        <div class="links"><span>首页</span><span>产品</span><span>文档</span><span>关于</span></div>
      </div>
      <div class="pv-hero" style="background:${light}">
        <div class="h" style="color:${cur[0].l>60?'#1a1a22':'#fff'}">好用的工作流工具</div>
        <div class="p" style="color:${cur[0].l>60?'rgba(0,0,0,.6)':'rgba(255,255,255,.8)'}">五分钟上手 · 数据本地存储 · 免费开源</div>
        <button class="pv-cta" style="background:${accent};color:${cur[3].l>60?'#1a1a22':'#fff'}">立即开始 →</button>
      </div>
      <div class="pv-foot" style="background:${dark};color:rgba(255,255,255,.7)">© 2026 Demo · 用当前配色实时渲染</div>
    </div>`;
  }
}
function setPv(btn,m){pvMode=m;document.querySelectorAll(".preview-tabs button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");renderPv()}

/* 交互 */
document.querySelectorAll(".harmony button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".harmony button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    harmony=b.dataset.h;
    render();
  };
});
function onTune(){
  $("hueV").textContent=$("hue").value+"°";
  $("satV").textContent=$("sat").value+"%";
  $("lightV").textContent=$("light").value+"%";
  render();
}
function generate(){
  $("hue").value=Math.floor(Math.random()*360);
  $("sat").value=45+Math.floor(Math.random()*40);
  $("light").value=45+Math.floor(Math.random()*20);
  onTune();
}
function toggleLock(i,e){
  if(e)e.stopPropagation();
  locks[i]=!locks[i];
  render();
}
function copyHex(hex,e){
  if(e)e.stopPropagation();
  copyText(hex);
}
function copyText(t){
  const done=()=>toast("已复制 "+t);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  }else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement("textarea");
  ta.value=t;ta.style.cssText="position:fixed;opacity:0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done()}catch(e){toast("复制失败，请手动复制")}
  document.body.removeChild(ta);
}
let toastTimer=null;
function toast(msg){
  const t=$("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
}

/* 收藏 */
function favCurrent(){
  const snap=cur.map(c=>hsl2hex(c.h,c.s,c.l));
  favs.unshift({colors:snap,harmony:HARM[harmony].name});
  if(favs.length>12)favs.pop();
  save();renderFavs();
  toast("已收藏（"+HARM[harmony].name+"）");
}
function applyFav(i){
  /* 恢复：从hex反推近似HSL并设置滑杆 */
  const c=favs[i].colors[2];
  const [h,s,l]=hex2hsl(c);
  $("hue").value=Math.round(h);$("sat").value=Math.round(s);$("light").value=Math.round(l);
  onTune();
}
function hex2hsl(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){
    const d=mx-mn;
    s=l>.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0))*60;
    else if(mx===g)h=((b-r)/d+2)*60;
    else h=((r-g)/d+4)*60;
  }
  return [h,s*100,l*100];
}
function delFav(i){
  favs.splice(i,1);save();renderFavs();
}
function renderFavs(){
  $("favList").innerHTML=favs.length?favs.map((f,i)=>`
    <div class="fav-row">
      <div class="fav-dots" onclick="applyFav(${i})" title="点击应用">${f.colors.map(c=>`<div style="background:${c}"></div>`).join("")}</div>
      <span class="txt">${esc(f.harmony)}</span>
      <button class="del" onclick="delFav(${i})">✕</button>
    </div>`).join(""):`<div class="empty">暂无收藏</div>`;
}
let clrArmed=false,clrTimer=null;
function clearFavs(){
  const btn=document.querySelector(".favs h3 button");
  if(!clrArmed){
    clrArmed=true;
    btn.textContent="确认清空?";btn.style.color="var(--red)";btn.style.borderColor="var(--red)";
    clearTimeout(clrTimer);
    clrTimer=setTimeout(()=>{clrArmed=false;btn.textContent="清空";btn.style.color="";btn.style.borderColor=""},3000);
    return;
  }
  clrArmed=false;clearTimeout(clrTimer);
  btn.textContent="清空";btn.style.color="";btn.style.borderColor="";
  favs=[];save();renderFavs();
}

/* 空格键生成新配色 */
document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();generate()}
});

renderFavs();
generate();
</script>
</body>
</html>
