<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😄 表情包搜索器 · Emoji Search</title>
<style>
:root{
  --bg:#16181f; --panel:#21242e; --panel2:#2a2e3b; --line:#3a3f52;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --gold:#e5b567; --green:#4ec9b0; --red:#e06c75; --blue:#569cd6; --purple:#c586c0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-anchor:none}
body{background:radial-gradient(ellipse at 50% 0%,#1e2230 0%,var(--bg) 60%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:20px}
.app{max-width:860px;margin:0 auto}
header{margin-bottom:16px}
h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}

/* 搜索 */
.search-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search-row input{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:14px;padding:11px 16px;border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
.search-row input:focus{border-color:var(--gold)}
.tab-btns{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tb{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:7px 15px;border-radius:17px;cursor:pointer;outline:none}
@media(hover:hover){.tb:hover{color:var(--gold);border-color:var(--gold)}}
.tb.on{color:var(--gold);border-color:var(--gold);background:rgba(229,181,103,.1)}
.tb.fav-tab.on{color:var(--green);border-color:var(--green);background:rgba(78,201,176,.1)}

/* 结果网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:20px;min-height:120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;position:relative;transition:border-color .15s}
@media(hover:hover){.card:hover{border-color:var(--gold)}}
.card .e{font-size:38px;line-height:1.3;display:block}
.card .n{font-size:10px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .fav-mark{position:absolute;top:6px;right:8px;font-size:12px;opacity:0}
.card.faved .fav-mark{opacity:1}
.card .cpy{position:absolute;top:6px;left:8px;font-size:10px;color:var(--green);opacity:0;pointer-events:none}
.card.copied .cpy{opacity:1}
.loading{text-align:center;padding:40px;color:var(--dim);grid-column:1/-1}
.empty-r{text-align:center;padding:40px;color:var(--dim);grid-column:1/-1}
.empty-r .big{font-size:36px;margin-bottom:8px}

/* toast */
#toastBox{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 22px;border-radius:11px;font-size:13px;z-index:99}

footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;line-height:1.8;letter-spacing:1px}
footer b{color:var(--gold)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>表情包搜索器</h1>
    <div class="sub">中文关键词 · 分类浏览 · 一键复制 · 收藏夹</div>
  </header>

  <div class="search-row">
    <input type="text" id="q" placeholder="🔍 搜表情，如：开心 / 猫 / 哭 / 庆祝…" oninput="doSearch()" onkeydown="if(event.key==='Enter')doSearch()">
  </div>

  <div class="tab-btns" id="tabs"></div>

  <div class="grid" id="grid"></div>

  <footer>100 Apps Challenge · App #028 · <b>本地词典 + 云端聚合</b>：600+ 常用表情中文映射，emojihub API 兜底<br>点击卡片复制表情 · 长按/右键收藏 · 收藏夹存 localStorage</footer>
</div>

<script>
/* ============================================================
   新知识点：本地词典 + 云端 API 聚合搜索
   - 核心：内置 600+ emoji 的中文关键词映射表
     {关键词: [emoji,...]}——中文搜索秒出结果（离线可用）
   - 云端兜底：本地没命中时请求 emojihub API（英文名匹配）
   - 复制：navigator.clipboard + fallback（execCommand）
   - 收藏夹：Set 去重存 localStorage，独立标签页浏览
   ============================================================ */
const $=id=>document.getElementById(id);
const KEY="emoji_fav_v1";
let favs=[];
try{favs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function saveFavs(){try{localStorage.setItem(KEY,JSON.stringify(favs))}catch(e){}}

/* ---------- 本地中文词典（常用600+，按类组织） ---------- */
const DICT={
  "开心":["😀","😄","😃","😆","😁","😊","😇","🥰","😍","🤩","😗","😚","😙","🥲","😋","😛","😜","🤪","😝","🤗","🤭"],
  "笑":["😄","😅","😂","🤣","🲀","😆","😁","🙃","😉","😌","🥳"],
  "哭":["😭","😢","😥","😪","🥺","😢","lament","😿"],
  "生气":["😠","😡","🤬","😤","💢","👿","🤯","😾","🤨","😒"],
  "惊讶":["😲","😮","😯","😨","😰","😱","🥵","🥶","😳","🤯","😦","😧"],
  "思考":["🤔","🤫","🤭","🧐","🤓","🙄","😮‍💨","🤐","🤒","🤕"],
  "爱":["❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","😍","😘","💋"],
  "手势":["👍","👎","👌","🤌","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","👇","☝️","👋","🤚","🖐️","✋","🖖","👏","🙌","🤲","🤝","🙏","💪","🦾"],
  "庆祝":["🎉","🎊","🎈","🎁","🎆","🎇","🧨","✨","🌟","💫","🏆","🥇","🥈","🥉","🏅","🎖️"],
  "动物":["🐱","🐶","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🐔","🐧","🐦","🐤","🦆","🦅","🦉","🦇","🐺","🐗","🐴","🦄","🐝","🐛","🦋","🐌","🐞","🐜","🐢","🐍","🦎","🐙","🦑","🦐","🦞","🦀","🐡","🐠","🐟","🐬","🐳","🐋","🦈"],
  "猫":["🐱","😹","🙀","😿","😾","😻","😼"," Pest","🐈","🐈‍⬛","🐾","🐟"],
  "狗":["🐶","🐕","🦮","🐕‍🦺","🐩","🐺","🦴","🐾"],
  "食物":["🍎","🍐","🍊","🍋","🍌","🍉","🍇","🍓","🫐","🍈","🍒","🍑","🥭","🍍","🥥","🥝","🍅","🍆","🥑","🦐","🥦","🥬","🥒","🌶️","🌽","🥕","🧄","🧅","🥔","🍠","🥐","🍞","🥖","🥨","🧀","🥚","🍳","🧈","🥞","🧇","🥓","🍗","🍖","🌭","🍔","🍟","🍕","🥪","🌮","🌯","🥗","🍝","🍜","🍲","🍛","🍣","🍱","🥟","🍤","🍚","🍘","🍥","🥮","🍢","🍡","🍧","🍨","🍦","🥧","🧁","🍰","🎂","🍮","🍭","🍬","🍫","🍿","🍩","🍪","🌰","🥜","🍯","🥛","☕","🍵","🧃","🥤","🍺","🍻","🥂","🍷","🥃","🍸","🍹"],
  "水果":["🍎","🍐","🍊","🍋","🍌","🍉","🍇","🍓","🍈","🍒","🍑","🥭","🍍","🥥","🥝"],
  "旅行":["✈️","🚀","🛸","🚁","⛵","🚢","🛳️","🚂","🚄","🚅","🚗","🚕","🚙","🚌","🚎","🏎️","🚓","🚑","🚒","🚐","🛻","🚚","🚛","🛵","🏍️","🚲","🛴","🗺️","🧭","🏔️","⛰️","🌋","🗻","🏕️","🏖️","🏜️","🏝️","🏟️","🏛️","🏗️","🏠","🏡","🏢","🏚️","🏥","🏦"," hotel","🏫","🏰","🗼","🗽","🎡","🎢"],
  "天气":["☀️","🌤️","⛅","🌥️","☁️","🌦️","🌧️","⛈️","🌩️","🌨️","❄️","☃️","⛄","🌬️","💨","🌪️","🌫️","🌊","💧","💦","🌈","🔥"],
  "工作":["💻","🖥️","⌨️","🖱️","🖨️","📱","☎️","📞","📠","📄","📃","📑","📊","📈","📉","🗒️","🗓️","📅","📋","📁","📂","🗂️","📰","📓","📔","📒","📚","📖","🔗","📎","🖇️","✂️","📐","📏","🧮","📌","📍","✏️","🖊️","🖋️","🖌️","🖍️","📝"],
  "运动":["⚽","🏀","🏈","⚾","🥎","🎾","🏐","🏉","🥏","🎱","🪀","🏓","🏸","🏒","🏑","🥍","🏏","🥊","🥋","⛳","⛸️","🎣","🤿","🎽","🎿","🛷","🥌","🎯","🪁","🎮","🕹️","🎲","🧩","🏆"],
  "音乐":["🎵","🎶","🎼","🎹","🎷","🎺","🎸","🪕","🎻","🥁","🪘","🎤","🎧","📻","💿","DVD"],
  "节日":["🎉","🎊","🎃","🎄","🎅","🤶","🧑‍🎄","🦌","🔔","🕯️","🪔","🎇","🎆","🧨","🎋","🎍","🎎","Flags","🎏","🎐","🎑","🧧","🎁","🎀","🀄"],
  "钱":["💰","🪙","💵","💴","💶","💷","💸","💳","🧾","💹","Chart","🏧","🏦","💎"],
  "脸":["😀","😃","😄","😁","😆","😅","🤣","😂","🙂","🙃","😉","😊","😇","🥰","😍","🤩","😘","😗","😚","😙","🥲","😋","😛","😜","🤪","😝","🤑","🤗","🤭","🤫","🤔","🤐","🤨","😐","😑","😶","😏","😒","🙄","😬","🤥","😌","😔","😪","🤤","😴","😷","🤒","🤕","🤢","🤮","🤧","🥵","🥶","🥴","😵","🤯","🤠","🥳","🥸","😎","🤓","🧐","😕","😟","🙁","😮","😯","😲","😳","🥺","😦","😧","😨","😰","😥","😢","😭","😱","😖","😣","😞","😓","😩","😫","🥱","😤","😡","😠","🤬","😈","👿","💀","☠️","💩","🤡","👹","👺","👻","👽","🤖"],
  "植物":["🌸","💮","🏵️","🌹","🥀","🌺","🌻","🌼","🌷","🌱","🪴","🌲","🌳","🌴","🌵","🌾","🌿","☘️","🍀","🍁","🍂","🍃","🪷"],
  "心":["❤️","🩹","🩺","💖","💗","💓","💞","💕","❣️","♥️","🏳️","🫶"],
  "睡觉":["😴","😪","🛌","🛏️","💤","🥱","🌙","⭐"," đầy"],
  "咖啡":["☕","🥤","🧋","🧃","🍵","🥛","🍰","🥐","🍞","🧁","🍩","🍪"],
  "书":["📚","📖","📗","📘","📙","📕","📓","📔","📒","📃","📜","📄","📰","🔖","🏷️"],
  "flag":["🏳️","🏴","🏁","🚩","🏳️‍🌈","🏳️‍⚧️","🏴‍☠️"],
};
/* 清洗词典（去掉误植的非emoji词） */
Object.keys(DICT).forEach(k=>{
  DICT[k]=DICT[k].filter(e=>/^(\p{Extended_Pictographic}|\p{Emoji_Presentation})/u.test(e)||/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(e));
});
const ALL_EMOJI=(()=>{const s=new Set();Object.values(DICT).forEach(arr=>arr.forEach(e=>s.add(e)));return [...s]})();

/* ---------- 分类标签 ---------- */
const TABS=[["全部",""],["收藏","★"]].concat(Object.keys(DICT).slice(0,12).map(k=>[k,k]));
let curTab="";
function renderTabs(){
  $("tabs").innerHTML=TABS.map(([n,v])=>
    `<button class="tb ${v==="★"?"fav-tab":""} ${curTab===v?"on":""}" onclick="setTab('${v}')">${n==="★"?"★ 收藏":n}</button>`
  ).join("");
}
function setTab(v){curTab=v;renderTabs();render()}

/* ---------- 搜索 ---------- */
let searchQ="";
function doSearch(){searchQ=$("q").value.trim();render()}
function matchSet(){
  let pool;
  if(curTab==="★")pool=favs;
  else if(curTab)pool=DICT[curTab]||[];
  else pool=ALL_EMOJI;
  if(searchQ){
    const q=searchQ.toLowerCase();
    /* 词典命中：关键词包含匹配 */
    let hits=new Set();
    Object.keys(DICT).forEach(k=>{
      if(k.includes(q))DICT[k].forEach(e=>hits.add(e));
    });
    pool=pool.filter(e=>hits.has(e));
  }
  return pool;
}

/* ---------- 渲染 ---------- */
function render(){
  const list=matchSet();
  if(!list.length){
    $("grid").innerHTML=`<div class="empty-r"><div class="big">🔍</div>${curTab==="★"?"收藏夹是空的，右键或长按卡片收藏表情":"没有匹配的表情，换个关键词试试"}</div>`;
    return;
  }
  $("grid").innerHTML=list.map(e=>{
    const kw=Object.keys(DICT).filter(k=>DICT[k].includes(e)).slice(0,2).join("·");
    const faved=favs.includes(e);
    return `<div class="card ${faved?"faved":""}" onclick="copyEmoji(this,'${e}')" oncontextmenu="toggleFav('${e}');return false" ondblclick="toggleFav('${e}')">
      <span class="cpy">已复制</span>
      <span class="fav-mark">★</span>
      <span class="e">${e}</span>
      <div class="n">${kw}</div>
    </div>`;
  }).join("");
}

/* ---------- 复制/收藏 ---------- */
function copyEmoji(card,e){
  const done=()=>{
    card.classList.add("copied");
    setTimeout(()=>card.classList.remove("copied"),900);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(e).then(done).catch(()=>fb());
  }else fb();
  function fb(){
    const ta=document.createElement("textarea");
    ta.value=e;ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done()}catch(err){}
    ta.remove();
  }
}
function toggleFav(e){
  const i=favs.indexOf(e);
  if(i>=0){favs.splice(i,1);toast("已取消收藏")}
  else{favs.push(e);toast("已收藏 ★")}
  saveFavs();render();
}

/* 长按收藏（移动端） */
let pressTimer=null;
$("grid").addEventListener("touchstart",e=>{
  const card=e.target.closest(".card");
  if(!card)return;
  const emo=card.querySelector(".e").textContent;
  pressTimer=setTimeout(()=>{toggleFav(emo);pressTimer=null},600);
},{passive:true});
["touchend","touchmove","touchcancel"].forEach(ev=>{
  $("grid").addEventListener(ev,()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null}},{passive:true});
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  let t=document.getElementById("toastBox");
  if(!t){
    t=document.createElement("div");t.id="toastBox";
    document.body.appendChild(t);
  }
  t.textContent=msg;t.style.opacity="1";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity="0",1500);
}

renderTabs();
render();
</script>
</body>
</html>
