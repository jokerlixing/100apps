<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Apps Challenge · 星哥的一百应用挑战</title>
<style>
:root{
  --bg:#1a1b26; --panel:#232433; --panel2:#2a2b3d; --line:#363850;
  --text:#d5d7e4; --muted:#8b8fa8; --dim:#5c6079;
  --green:#4ec9b0; --blue:#569cd6; --orange:#e5a663; --purple:#c586c0; --red:#e06c75;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:24px}
.wrap{max-width:1200px;margin:0 auto}

/* header */
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px}
h1{font-size:26px;font-weight:700;letter-spacing:.5px}
h1 .grad{background:linear-gradient(90deg,var(--green),var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--green);border-color:var(--green);color:#12211d;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:#12211d}

/* dashboard */
.dash{display:flex;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px;flex-wrap:wrap}
.ring-box{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:160px}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:30px;font-weight:700}
.ring .num span{font-size:12px;color:var(--muted)}
.stats{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;min-width:280px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .v{font-size:26px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.milestone{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;width:100%;font-size:13px;color:var(--muted)}
.milestone b{color:var(--green)}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.search{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none}
.search:focus{border-color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:.15s}
.chip.on{color:#12131a;font-weight:600}
.chip:hover{opacity:.85}

/* add bar */
.addbar{display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.addbar input,.addbar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none}
.addbar input:focus,.addbar select:focus{border-color:var(--green)}
.addbar .name{flex:2;min-width:160px}
.addbar .desc{flex:3;min-width:200px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:.15s;position:relative}
.card:hover{border-color:var(--dim);transform:translateY(-2px)}
.card.done{border-left:3px solid var(--green)}
.card.doing{border-left:3px solid var(--orange)}
.card.todo{border-left:3px solid var(--dim)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.idx{font-size:12px;color:var(--dim);font-family:Consolas,monospace}
.lv{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.lv1{background:rgba(78,201,176,.15);color:var(--green)}
.lv2{background:rgba(86,156,214,.15);color:var(--blue)}
.lv3{background:rgba(229,166,99,.15);color:var(--orange)}
.lv4{background:rgba(197,134,192,.15);color:var(--purple)}
.lv5{background:rgba(224,108,117,.15);color:var(--red)}
.name{font-size:15px;font-weight:600;line-height:1.35}
.card.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.desc{font-size:12px;color:var(--muted);line-height:1.5;flex:1}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.status-btn{border:none;cursor:pointer;padding:5px 12px;border-radius:14px;font-size:12px;font-weight:600;transition:.15s}
.status-btn.todo{background:rgba(92,96,121,.2);color:var(--muted)}
.status-btn.doing{background:rgba(229,166,99,.18);color:var(--orange)}
.status-btn.done{background:rgba(78,201,176,.18);color:var(--green)}
.status-btn:hover{filter:brightness(1.3)}
.link-edit{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:12px}
.link-edit:hover{color:var(--blue)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.idx-lv{display:flex;align-items:center;gap:8px;min-width:0}
.card a.go{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(86,156,214,.15);color:var(--blue);text-decoration:none;white-space:nowrap;flex-shrink:0;transition:.15s}
.card a.go:hover{background:var(--blue);color:#12131a}
.empty{text-align:center;color:var(--dim);padding:60px 0;font-size:14px;grid-column:1/-1}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--green);color:var(--text);padding:12px 24px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* 链接编辑弹层（替代 prompt，内置浏览器兼容） */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-size:14px;margin-bottom:12px}
.modal input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;-webkit-user-select:text;user-select:text;font-family:Consolas,monospace}
.modal input:focus{border-color:var(--blue)}
.modal .tip{font-size:11px;color:var(--dim);margin-top:8px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:24px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🚀 <span class="grad">100 Apps Challenge</span></h1>
      <div class="sub">星哥的一百应用挑战 · App #001 就是这个追踪器本身 · 数据存在浏览器本地</div>
    </div>
  </header>

  <div class="dash">
    <div class="ring-box">
      <div class="ring">
        <svg width="150" height="150">
          <circle cx="75" cy="75" r="64" fill="none" stroke="var(--line)" stroke-width="10"/>
          <circle id="prog" cx="75" cy="75" r="64" fill="none" stroke="url(#g1)" stroke-width="10" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402"/>
          <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4ec9b0"/><stop offset="100%" stop-color="#569cd6"/>
          </linearGradient></defs>
        </svg>
        <div class="num"><b id="doneNum">0</b><span>/ 100 完成</span></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v" style="color:var(--green)" id="sDone">0</div><div class="l">✅ 已完成</div></div>
      <div class="stat"><div class="v" style="color:var(--orange)" id="sDoing">0</div><div class="l">🔥 进行中</div></div>
      <div class="stat"><div class="v" style="color:var(--muted)" id="sTodo">100</div><div class="l">📋 未开始</div></div>
      <div class="stat"><div class="v" style="color:var(--blue)" id="sPct">0%</div><div class="l">📈 总进度</div></div>
      <div class="stat"><div class="v" style="color:var(--purple)" id="sStreak">-</div><div class="l">🏆 最近完成</div></div>
    </div>
    <div class="milestone" id="milestone"></div>
  </div>

  <div class="filters">
    <input class="search" id="q" placeholder="🔍 搜索应用名称或描述…" oninput="render()">
    <div class="chips" id="lvChips"></div>
    <div class="chips" id="stChips"></div>
  </div>

  <div class="addbar">
    <input class="name" id="addName" placeholder="自定义应用名称，如：猫粮余量计算器" maxlength="30">
    <input class="desc" id="addDesc" placeholder="一句话描述（可选）" maxlength="60">
    <select id="addLv">
      <option value="1">L1 入门</option><option value="2">L2 进阶</option>
      <option value="3" selected>L3 前后端</option><option value="4">L4 全栈AI</option><option value="5">L5 综合</option>
    </select>
    <button class="btn primary" onclick="addCustom()">➕ 添加点子</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    规则很简单：上线一个，勾一个 · 每 10 个是一个里程碑 🎉<br>
    Challenge started · 每一个伟大的开发者都从 App #001 开始
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="linkMask" onclick="if(event.target===this)closeLinkModal()">
  <div class="modal">
    <h3 id="linkTitle">🔗 设置访问链接</h3>
    <input type="text" id="linkInput" placeholder="https://your-app-url.example.com/" onkeydown="if(event.key==='Enter')saveLink()">
    <div class="tip">留空则清除链接 · Enter 快速保存</div>
    <div class="btns">
      <button class="btn" onclick="closeLinkModal()">取消</button>
      <button class="btn primary" onclick="saveLink()">保存</button>
    </div>
  </div>
</div>

const KEY="apps100_v3";
const INIT_DONE={1:"done",2:"done",3:"done",4:"done",5:"done",6:"done",7:"done",8:"done",9:"done",10:"done",11:"done",12:"done",13:"done",14:"done",15:"done",16:"done",17:"done",18:"done",19:"done",20:"done",21:"done",22:"done",23:"done",24:"done",25:"done",26:"done",27:"done",28:"done",29:"done",30:"done",31:"done",32:"done",33:"done",34:"done",35:"done",36:"done",37:"done",38:"done",39:"done",40:"done",41:"done",42:"done",43:"done",44:"done",45:"done",46:"done",47:"done",48:"done",49:"done",50:"done",51:"done",52:"done",53:"done",54:"done",55:"done",56:"done",57:"done",58:"done",59:"done",60:"done",61:"done",62:"done",63:"done",64:"done",65:"done",66:"done",67:"done",68:"done",69:"done",70:"done",71:"done",72:"done",73:"done",74:"done",75:"done",76:"done",77:"done",78:"done",79:"done",80:"done",82:"done",87:"done",90:"done",91:"done",99:"done"}; // 挑战官方进度
INIT_DONE[86]="done";
INIT_DONE[96]="done";
let apps=[];
function load(){
  try{const s=localStorage.getItem(KEY);if(s){apps=JSON.parse(s);syncOfficial();return}}catch(e){}
  apps=IDEAS.map((a,i)=>({id:i+1,name:a[0],desc:a[1],lv:+a[2],st:INIT_DONE[i+1]||"todo",custom:false,link:a[3]||""}));
  save();
}
/* 同步官方资料：内置应用的名称、说明、等级、链接与完成态以代码为准（自定义点子不受影响） */
function syncOfficial(){
  let dirty=false;
  apps.forEach(a=>{
    if(a.custom)return;
    const idea=IDEAS[a.id-1];
    if(!idea)return;
    const official={name:idea[0],desc:idea[1],lv:+idea[2],link:idea[3]||""};
    Object.entries(official).forEach(([key,value])=>{if(a[key]!==value){a[key]=value;dirty=true}});
    if(INIT_DONE[a.id]==="done"&&a.st!=="done"){a.st="done";dirty=true}
  });
  if(dirty)save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(apps))}

let fLv=0,fSt="";
function chip(label,on,fn,cls){return `<button class="chip ${on?'on '+cls:''}" style="${on?'background:'+(cls=='lvx'?'var(--blue)':'var(--orange)'):''}" onclick="${fn}">${label}</button>`}
function renderChips(){
  document.getElementById("lvChips").innerHTML=
    chip("全部难度",fLv===0,"setLv(0)","lvx")+
    [1,2,3,4,5].map(l=>chip(LV_NAMES[l],fLv===l,`setLv(${l})`,"lvx")).join("");
  const stDef=[["","全部状态"],["todo","未开始"],["doing","进行中"],["done","已完成"]];
  document.getElementById("stChips").innerHTML=
    stDef.map(s=>chip(s[1],fSt===s[0],`setSt('${s[0]}')`,"stx")).join("");
}
function setLv(l){fLv=l;renderChips();render()}
function setSt(s){fSt=s;renderChips();render()}

function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const list=apps.filter(a=>
    (!fLv||a.lv===fLv)&&(!fSt||a.st===fSt)&&
    (!q||a.name.toLowerCase().includes(q)||a.desc.toLowerCase().includes(q)));
  const g=document.getElementById("grid");
  if(!list.length){g.innerHTML=`<div class="empty">没有匹配的应用，换个条件试试 🔍</div>`}
  else g.innerHTML=list.map(a=>`
    <div class="card ${a.st}">
      <div class="top">
        <div class="idx-lv">
          <span class="idx">#${String(a.id).padStart(3,"0")}${a.custom?" ✏️":""}</span>
          ${a.link?`<a class="go" href="${esc(a.link)}${a.link.includes("?")?"&":"?"}_ts=${Date.now()}" target="_blank">访问 ↗</a>`:""}
        </div>
        <span class="lv lv${a.lv}">${LV_NAMES[a.lv]}</span>
      </div>
      <div class="name">${esc(a.name)}</div>
      <div class="desc">${esc(a.desc)}</div>
      <div class="bottom">
        <button class="status-btn ${a.st}" onclick="cycle(${a.id})">${ST_NAMES[a.st]} →</button>
        <button class="link-edit" onclick="setLink(${a.id})" title="填写部署链接">🔗</button>
        ${a.custom?`<button class="link-edit" onclick="delCustom(${a.id},this)" title="删除">🗑</button>`:""}
      </div>
    </div>`).join("");
  updateDash();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function cycle(id){
  const a=apps.find(x=>x.id===id);if(!a)return;
  const from=a.st;a.st=NEXT[a.st];save();
  if(a.st==="done"){
    const n=apps.filter(x=>x.st==="done").length;
    if(n%10===0)toast(`🎉 里程碑达成：${n} 个应用！继续冲！`);
    else toast(`✅ #${String(id).padStart(3,"0")} ${a.name} 完成！`);
  } else if(a.st==="todo"&&from==="done"){toast(`↩️ 已撤销完成状态`)}
  render();
}
/* 链接编辑：弹层代替 prompt（内置浏览器不拦截） */
let linkEditId=null;
function setLink(id){
  const a=apps.find(x=>x.id===id);if(!a)return;
  linkEditId=id;
  document.getElementById("linkTitle").textContent=`🔗 #${String(id).padStart(3,"0")} ${a.name} 的链接`;
  document.getElementById("linkInput").value=a.link||"";
  document.getElementById("linkMask").classList.add("show");
  setTimeout(()=>document.getElementById("linkInput").focus(),50);
}
function saveLink(){
  const a=apps.find(x=>x.id===linkEditId);if(!a)return closeLinkModal();
  const v=document.getElementById("linkInput").value.trim();
  /* 简单校验：要么空，要么像 URL */
  if(v&&!/^(https?:\/\/|\/|\.\/)/.test(v)){toast("链接需以 http(s):// 开头");return}
  a.link=v;save();render();
  closeLinkModal();
  toast(v?"🔗 链接已保存":"🔗 链接已清除");
}
function closeLinkModal(){
  document.getElementById("linkMask").classList.remove("show");
  linkEditId=null;
}
/* 删除自定义点子：内联二次确认（替代 confirm） */
let delCusArmed=0,delCusTimer=null;
function delCustom(id,btn){
  if(delCusArmed!==id){
    delCusArmed=id;
    if(btn)btn.textContent="确认?⚠";
    document.querySelectorAll(".link-edit").forEach(b=>{if(b!==btn&&b.textContent==="确认?⚠")b.textContent="🗑"});
    clearTimeout(delCusTimer);
    delCusTimer=setTimeout(()=>{delCusArmed=0;if(btn&&btn.textContent==="确认?⚠")btn.textContent="🗑"},3000);
    return;
  }
  clearTimeout(delCusTimer);delCusArmed=0;
  apps=apps.filter(x=>x.id!==id);save();render();
  toast("🗑 已删除自定义点子");
}
function addCustom(){
  const n=document.getElementById("addName").value.trim();
  if(!n){toast("先填个应用名称 👀");return}
  const d=document.getElementById("addDesc").value.trim()||"自定义点子";
  const lv=+document.getElementById("addLv").value;
  const id=Math.max(0,...apps.map(a=>a.id))+1;
  apps.push({id,name:n,desc:d,lv,st:"todo",custom:true,link:""});
  save();
  document.getElementById("addName").value="";document.getElementById("addDesc").value="";
  toast(`➕ 已添加 #${String(id).padStart(3,"0")} ${n}`);render();
}
function updateDash(){
  const done=apps.filter(a=>a.st==="done").length,doing=apps.filter(a=>a.st==="doing").length,
        todo=apps.filter(a=>a.st==="todo").length,total=apps.length,
        pct=total?Math.round(done/total*100):0;
  document.getElementById("doneNum").textContent=done;
  document.getElementById("sDone").textContent=done;
  document.getElementById("sDoing").textContent=doing;
  document.getElementById("sTodo").textContent=todo;
  document.getElementById("sPct").textContent=pct+"%";
  document.getElementById("sStreak").textContent=done?`${done} 连击`:"—";
  const off=402-402*pct/100;
  document.getElementById("prog").style.strokeDashoffset=off;
  const nextMs=Math.floor(done/10)*10+10;
  document.getElementById("milestone").innerHTML= done>=100
    ?`🏅 <b>传说达成！</b>100个应用全部完成，星哥封神！`
    :`下一个里程碑：<b>${nextMs} 个</b> · 还差 <b>${nextMs-done}</b> 个 · ${"▓".repeat(done%10==0&&done>0?10:done%10)}${"░".repeat(done%10==0&&done>0?0:10-done%10)} ${done%10==0&&done>0?10:done%10}/10`;
}
let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2400);
}
load();renderChips();render();
</script>
